<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온고지신</title>
<style>
  @font-face {
    font-family: 'HsSummerWaterLight';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/HSSummer.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }
  @font-face{font-family:"Pretendard";src:url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Pretendard";src:url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Pretendard";src:url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Pretendard";src:url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2") format("woff2");font-weight:700 800;font-display:swap}
  @font-face {
    font-family: '87mmDailyRegular';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201@1.0/87MMILSANG-Regular.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  :root{
    --page:#FFFFFF; --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --sub:#6E6E73;
    --line:#E5E5EA; --accent:#2F7A56; --accent-soft:#E4F0E9;
    --ok:#2F7A56; --ok-bg:#E4F0E9; --okb:#C9E0D3;
    --no:#8A4438; --no-bg:#F6ECEA; --nob:#E8D2CD;
    --warn:#8A6A2E; --warn-bg:#F6F1E6; --warnb:#E9DFC6;
    --hl:#F2E9C8; --hlline:#D9C27A;
    --hover:#F2F2F5; --grip:#C9C9D0; --bar-bg:rgba(251,251,252,.94);
    --shadow:none; --side:#FBFBFC; --line2:#EBEBEF;
  }
  /* 다크 모드 — 자동 감지 + 수동 전환(data-theme) */
  @media (prefers-color-scheme: dark){ :root{ --page:#141415; --bg:#232326; --card:#1C1C1E; --ink:#F2F2F7; --sub:#98989F;
    --line:#38383A; --accent:#5FA97F; --accent-soft:#233A2E;
    --ok:#5FA97F; --ok-bg:#233A2E; --okb:#2F4A3B;
    --no:#D98A7C; --no-bg:#3A2622; --nob:#4A302B;
    --warn:#D1AE6A; --warn-bg:#352E1F; --warnb:#4A4029;
    --hl:#4A3F14; --hlline:#93752A;
    --hover:#2A2A2D; --grip:#56565B; --bar-bg:rgba(28,28,30,.94);
    --shadow:none; --side:#1A1A1C; --line2:#2C2C2E; } }
  :root[data-theme="dark"]{ --page:#141415; --bg:#232326; --card:#1C1C1E; --ink:#F2F2F7; --sub:#98989F;
    --line:#38383A; --accent:#5FA97F; --accent-soft:#233A2E;
    --ok:#5FA97F; --ok-bg:#233A2E; --okb:#2F4A3B;
    --no:#D98A7C; --no-bg:#3A2622; --nob:#4A302B;
    --warn:#D1AE6A; --warn-bg:#352E1F; --warnb:#4A4029;
    --hl:#4A3F14; --hlline:#93752A;
    --hover:#2A2A2D; --grip:#56565B; --bar-bg:rgba(28,28,30,.94);
    --shadow:none; --side:#1A1A1C; --line2:#2C2C2E; }
  :root[data-theme="light"]{ --page:#FFFFFF; --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --sub:#6E6E73;
    --line:#E5E5EA; --accent:#2F7A56; --accent-soft:#E4F0E9;
    --ok:#2F7A56; --ok-bg:#E4F0E9; --okb:#C9E0D3;
    --no:#8A4438; --no-bg:#F6ECEA; --nob:#E8D2CD;
    --warn:#8A6A2E; --warn-bg:#F6F1E6; --warnb:#E9DFC6;
    --hl:#F2E9C8; --hlline:#D9C27A;
    --hover:#F2F2F5; --grip:#C9C9D0; --bar-bg:rgba(251,251,252,.94);
    --shadow:none; --side:#FBFBFC; --line2:#EBEBEF; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 화면 너비: 넓은 화면은 --w 까지, 폰은 겹치는 안쪽 여백을 줄여 글자 폭 확보 */
  :root{--w:760px}

  button,input,textarea,select{font-family:inherit}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.6;letter-spacing:-0.012em;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:var(--w);margin:0 auto;padding:24px 18px 90px}
  header{text-align:center;margin:10px 0 22px}
  header h1{font-family:'HsSummerWaterLight',Batang,"AppleMyungjo",serif;font-size:26px;font-weight:normal;
    margin:0;letter-spacing:.1em;margin-right:-.1em;color:var(--accent)}
  header p{font-size:12.5px;color:var(--sub);margin:7px 0 0;letter-spacing:.01em}

  label{display:block;font-size:13px;color:var(--sub);margin:14px 2px 5px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;
    padding:12px 13px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink)}
  textarea{resize:vertical;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;box-shadow:var(--shadow)}
  .msg{font-size:13px;padding:10px 13px;border-radius:10px;margin:10px 0}
  .msg.err{background:var(--no-bg);color:var(--no)}
  .msg.okmsg{background:var(--accent-soft);color:var(--accent)}
  .authtabs{display:flex;gap:6px;margin-bottom:14px}
  .authtab{flex:1;padding:9px;border:1px solid var(--line);background:var(--bg);
    border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
  .authtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--sub)}

  .ptitle{font-size:13px;color:var(--sub);margin:4px 2px 12px}
  /* 상단 프로필 버튼 + 바텀 시트 메뉴 */
  .topmenu{display:flex;justify-content:flex-end;margin-bottom:8px}
  .avatarbtn{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:15px;border:1px solid var(--okb);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
  .sheeto{position:fixed;inset:0;background:rgba(20,19,17,.45);z-index:70;display:none;
    align-items:flex-end;justify-content:center}
  .sheeto.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:var(--w);border-radius:20px 20px 0 0;
    padding:8px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.22);
    animation:sheetUp .26s cubic-bezier(.22,1,.36,1)}
  @keyframes sheetUp{from{transform:translateY(45%);opacity:.5}to{transform:translateY(0);opacity:1}}
  .sheet .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 14px}
  .sprofile{display:flex;align-items:center;gap:12px;padding:2px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .sitem{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
    padding:13px 6px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer;
    text-align:left;border-radius:10px}
  .sitem:active{background:var(--bg)}
  .sitem.out{color:var(--no)}
  .sw{margin-left:auto;width:42px;height:25px;border-radius:999px;background:var(--line);
    position:relative;transition:background .2s;flex:0 0 auto}
  .sw.on{background:var(--accent)}
  .sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw.on i{left:20px}

  /* 오답 패널 */
  .wrongpanel{border:1px solid var(--warnb);background:var(--warn-bg);border-radius:16px;
    padding:14px 16px;margin-bottom:18px}
  .wrongpanel .wt{font-size:14px;font-weight:700;color:var(--warn);margin-bottom:10px}

  /* 도서관 */
  .book{border:1px solid var(--line);border-radius:16px;background:var(--card);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  .bookh{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
    padding:16px 18px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
  .bookh .cnt{font-size:12px;font-weight:500;color:var(--sub);margin-left:auto;margin-right:4px}
  .bookh .chev{transition:transform .2s;color:var(--sub);font-size:18px}
  .book.open .bookh .chev{transform:rotate(90deg)}
  .bookbody{display:none;padding:0 16px 14px}
  .book.open .bookbody{display:block}
  .unith{font-size:12px;color:var(--accent);font-weight:700;margin:12px 4px 8px;
    border-left:3px solid var(--accent-soft);padding-left:9px}
  .psg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:8px;
    transition:border-color .15s,transform .08s}
  .psg:hover{border-color:var(--accent)}.psg:active{transform:scale(.99)}
  .psg .cnt{font-size:11px;color:var(--sub);margin-left:auto}
  .psg.wrong{border-color:var(--warnb);background:var(--card)}

  /* 풀이 보드 */
  .board{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .cardx{display:flex;align-items:stretch;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;
    box-shadow:var(--shadow);transition:border-color .15s,background .2s}
  .cardx.dragging{opacity:.45}
  .cardx.over{border-color:var(--accent);border-style:dashed}
  .cardx .num{flex:0 0 26px;height:26px;border-radius:8px;background:var(--bg);
    color:var(--sub);font-size:13px;font-weight:600;display:flex;align-items:center;
    justify-content:center;align-self:center}
  .cardx .txt{flex:1;font-size:15px;padding:2px 0;word-break:break-word}
  .cardx .arrows{display:flex;flex-direction:column;gap:4px;justify-content:center}
  .cardx .arrows button{width:34px;height:26px;border:1px solid var(--line);
    background:var(--bg);border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1}
  .cardx .arrows button:active{background:var(--accent-soft)}
  .cardx .grip{flex:0 0 18px;align-self:center;color:var(--grip);cursor:grab;font-size:16px;
    user-select:none;touch-action:none;padding:4px 2px}
  .cardx .grip:active{cursor:grabbing}
  .cardx .mark{align-self:center;font-weight:700;font-size:15px}
  .cardx .mark.ok{color:var(--ok)} .cardx .mark.no{color:var(--no)}
  .cardx.ok{background:var(--ok-bg);border-color:var(--okb)}
  .cardx.ok .num{background:var(--ok);color:#fff}
  .cardx.no{background:var(--no-bg);border-color:var(--nob)}
  .cardx.no .num{background:var(--no);color:#fff}

  .bar{position:fixed;left:0;right:0;bottom:58px;background:var(--bar-bg);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px;
    display:flex;gap:10px;max-width:var(--w);margin:0 auto;align-items:center;z-index:21}
  .bar .result{flex:1;font-size:14px;color:var(--sub)}
  .bar .result b{color:var(--ink)}
  .btn{border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn:active{transform:scale(.98)}
  .btn.full{width:100%;margin-top:12px}

  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;
    color:var(--sub);font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:8px}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:50px 0}
  .done{text-align:center;background:var(--accent-soft);border:1px solid var(--okb);
    border-radius:14px;padding:16px;color:var(--accent);font-weight:600;margin-top:4px}
  .loading{display:flex;align-items:center;justify-content:center;gap:9px;
    color:var(--sub);padding:50px 0;font-size:14px}
  .spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn[disabled]{opacity:.6;cursor:default}
  /* 단색 라인 아이콘 */
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-2px}
  .ic.muted{stroke:var(--sub)} .ic.ok{stroke:var(--accent)} .ic.warn{stroke:var(--warn)}
  .ic.sm{width:13px;height:13px}

  /* 온보딩 */
  .ob{position:fixed;inset:0;background:rgba(43,42,39,.45);display:flex;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  .ob-card{background:var(--card);border-radius:20px;padding:24px 22px 18px;max-width:340px;width:100%;
    box-shadow:0 12px 44px rgba(0,0,0,.18);text-align:center}
  .ob-card h3{margin:6px 0 8px;font-size:18px;letter-spacing:-.01em}
  .ob-card p{margin:0;color:var(--sub);font-size:14px;min-height:42px}
  .ob-dots{display:flex;gap:6px;justify-content:center;margin:18px 0 16px}
  .ob-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
  .ob-dots i.on{background:var(--accent);width:18px;border-radius:4px}
  .ob-btns{display:flex;gap:8px}
  .demo{display:flex;flex-direction:column;gap:8px;margin:4px auto;width:210px;height:124px;
    justify-content:flex-end;overflow:hidden}
  .demo-row{height:36px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--sub)}
  .demo-row .g{color:var(--grip);font-size:14px}
  .demo-row.move{background:var(--card);border-color:var(--accent);color:var(--ink);position:relative;
    z-index:2;box-shadow:var(--shadow);animation:demoMove 2.8s ease-in-out infinite}
  @keyframes demoMove{
    0%{transform:translateY(0) scale(1);opacity:0}
    8%{opacity:1} 22%{transform:translateY(0) scale(1.05)}
    55%{transform:translateY(-88px) scale(1.05)} 72%{transform:translateY(-88px) scale(1)}
    92%{opacity:1} 100%{transform:translateY(-88px) scale(1);opacity:0}}
  .obpulse{animation:obpulse 1.6s ease-in-out infinite}
  @keyframes obpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* 2단계: 끌기 + 화살표 둘 다 */
  .demo2{display:flex;flex-direction:column;gap:14px;height:124px;justify-content:center}
  .drow{display:flex;align-items:center;gap:10px}
  .dcap{font-size:11px;color:var(--sub);width:46px;text-align:right;flex:0 0 auto}
  .dcard{flex:1;height:38px;border-radius:9px;background:var(--card);border:1px solid var(--accent);
    box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--ink)}
  .dcard .g{color:var(--grip);font-size:14px}
  .dcard.drag{animation:dragY 1.7s ease-in-out infinite}
  @keyframes dragY{0%,100%{transform:translateY(6px) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
  .dcard.arr{justify-content:space-between;animation:nudge 1.7s ease-in-out infinite}
  .dcard.arr .ac{display:flex;flex-direction:column;font-size:9px;line-height:1.1;color:var(--sub);align-items:center}
  @keyframes nudge{0%,45%,100%{transform:translateY(6px)}62%,86%{transform:translateY(-9px)}}
  .dcard.arr .up{display:inline-block;animation:press 1.7s ease-in-out infinite}
  @keyframes press{0%,50%,100%{color:var(--sub);transform:scale(1)}60%{color:var(--accent);transform:scale(1.45)}}

  /* 3단계: 이유 쓰기 */
  .rdemo{height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .rq{font-size:12px;color:var(--sub)}
  .rwrite{position:relative;width:180px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
  .rfill{position:absolute;left:12px;top:18px;height:2px;background:var(--accent);width:0;
    animation:write 2.8s ease-in-out infinite}
  @keyframes write{0%{width:0;opacity:1}68%{width:150px}84%{width:150px;opacity:1}100%{width:150px;opacity:0}}
  .rpen{position:absolute;top:8px;left:8px;animation:penMove 2.8s ease-in-out infinite}
  @keyframes penMove{0%{transform:translateX(0)}68%{transform:translateX(150px)}84%,100%{transform:translateX(150px)}}

  /* 하단 탭바 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;max-width:var(--w);margin:0 auto;
    background:var(--bar-bg);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    display:flex;z-index:20}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;
    border:none;padding:9px 0 11px;font-size:11px;color:var(--sub);cursor:pointer}
  .tab .ic{width:21px;height:21px;stroke:currentColor}
  .tab.active{color:var(--accent)}
  .stats3{display:flex;gap:10px;margin-bottom:8px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:24px;color:var(--ink)}
  .stat span{font-size:12px;color:var(--sub)}
  /* 내 기록 상세 */
  .rec{border:1px solid var(--nob);background:var(--no-bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .rec.solved{border-color:var(--okb);background:var(--accent-soft)}
  .rec .rh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .rec .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--no)}
  .rec .badge.ok{background:var(--accent)}
  .rec .when{margin-left:auto;font-size:11px;color:var(--sub);font-weight:500}
  .ord{display:flex;gap:8px;font-size:13px;padding:6px 9px;border-radius:8px;margin-top:6px;background:var(--card)}
  .ord .p{flex:0 0 20px;text-align:center;color:var(--sub);font-size:12px;align-self:center}
  .ord .s{flex:1}
  .ord .fix{flex:0 0 auto;font-size:11px;color:var(--no);align-self:center}
  .ord.good{opacity:.55}
  /* 확인 모달 */
  .modal{position:fixed;inset:0;background:rgba(43,42,39,.45);display:none;
    align-items:center;justify-content:center;z-index:60;padding:24px}
  .modal-card{background:var(--card);border-radius:18px;padding:24px 22px 18px;max-width:320px;width:100%;
    box-shadow:0 14px 48px rgba(0,0,0,.2);text-align:center;animation:modalIn .18s ease}
  .modal-msg{margin:4px 0 18px;font-size:15px;line-height:1.6;color:var(--ink)}
  .modal-btns{display:flex;gap:8px}
  @keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

  /* ---------- 독해 모드 ---------- */
  .rprog{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
  .rprog .bar2{flex:1;height:7px;background:var(--line);border-radius:999px;overflow:hidden}
  .rprog .fill2{height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
  .rprog .cnt{font-size:12px;color:var(--sub);font-weight:600;flex:0 0 auto}
  .rsent{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 18px;box-shadow:var(--shadow);font-size:19px;line-height:1.95;
    letter-spacing:-.01em;margin-bottom:4px}
  .rword{cursor:pointer;border-radius:5px;padding:1px 1px;transition:background .12s;
    -webkit-tap-highlight-color:transparent;position:relative}
  .rword:hover{background:var(--hover)}
  .rword.mark{background:var(--hl);box-shadow:inset 0 -2px 0 var(--hlline)}
  .rword.mark:hover{background:var(--hl)}
  /* 단어장에 뜻이 있는 단어: 점선 밑줄 + 커서 올리면 뜻 말풍선 */
  .rword.known{border-bottom:2px dotted #cdbf9a}
  /* 형광펜 칠 때 그 단어 위에 잠깐 뜨는 뜻 말풍선 */
  .wtip{position:absolute;z-index:60;background:var(--ink);color:var(--bg);
    border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.55;
    max-width:min(280px,82vw);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2);
    opacity:0;transform:translate(-50%,-100%) translateY(2px);transition:opacity .15s,transform .15s}
  .wtip.on{opacity:1;transform:translate(-50%,-100%) translateY(-5px)}
  .wtip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;
    border:5px solid transparent;border-top-color:var(--ink)}
  .wtip b{display:block;font-weight:700;margin-bottom:3px;color:var(--hl)}
  .wtip i{display:block;font-style:normal}
  .wtip i+i{margin-top:3px}
  /* color:inherit — 아래 .pos의 초록(--accent)이 새어 들어오는 걸 막으면서,
     말풍선이 테마에 따라 뒤집혀도 글자색이 같이 따라오게 한다 (흰색을 박으면 다크에서 안 보임) */
  .wtip .pos{display:inline-block;background:rgba(127,127,127,.28);border-radius:4px;
    padding:0 5px;margin-right:5px;font-size:10px;font-weight:700;color:inherit}
  .wtip .soft{opacity:.75}
  .rword.known:hover::after{content:attr(data-mean);position:absolute;bottom:calc(100% + 5px);
    left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;
    font-weight:500;line-height:1.4;padding:5px 10px;border-radius:8px;white-space:nowrap;
    max-width:220px;overflow:hidden;text-overflow:ellipsis;z-index:6;pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .rword.known:hover::before{content:'';position:absolute;bottom:100%;left:50%;
    transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);z-index:6;pointer-events:none}
  .rhelp{font-size:12px;color:var(--sub);margin:9px 4px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rinput{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:15px;font-family:inherit;line-height:1.6;background:var(--card);color:var(--ink)}
  .rinput:focus{outline:none;border-color:var(--accent)}
  .rrecap{margin-top:4px}
  .rritem{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:8px}
  .rritem .en{font-size:14px}
  .rritem .ko{font-size:13px;color:var(--accent);margin-top:6px;padding-top:7px;border-top:1px dashed var(--line)}
  .rritem .un{font-size:13px;color:var(--ink);margin-top:5px}
  .rritem .re{font-size:13px;color:var(--warn);margin-top:5px}
  .rritem .lb{font-size:11px;font-weight:700;opacity:.7;margin-right:5px}
  /* 단어장 */
  .vocab{border:1px solid var(--warnb);background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:8px}
  .vocab .w{font-size:16px;font-weight:700;color:var(--ink)}
  .vocab .ex{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.6}
  .vocab .ex mark{background:var(--hl);padding:0 2px;border-radius:3px;color:var(--ink)}
  .vocabbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--warnb);border-radius:12px;padding:13px 15px;font-size:14px;color:var(--ink);
    cursor:pointer;margin-bottom:14px;font-weight:600;box-shadow:var(--shadow)}
  .vocabbtn .cnt{margin-left:auto;color:var(--warn);font-weight:700}
  /* 단어장 탭: 레벨 점·뜻 편집 */
  .vocab .vrow{display:flex;align-items:center;gap:8px}
  .vocab .lv{display:flex;gap:3px;margin-left:auto}
  .vocab .lv i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .vocab .lv i.on{background:var(--accent)}
  .vocab .mean{font-size:13px;color:var(--ink);margin-top:6px;padding-top:7px;border-top:1px dashed var(--line)}
  .vocab .mean .lb{font-size:11px;font-weight:700;color:var(--accent);margin-right:5px}
  .vocab .mlink{font-size:12px;color:var(--sub);text-decoration:underline;cursor:pointer;margin-right:10px}
  .vocab .defbox{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.55}
  .vocab input{margin-top:6px;font-size:14px;padding:9px 11px}
  /* 품사 배지 + 품사별 뜻 줄 */
  .pos{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border-radius:5px;padding:1px 5px;margin-right:3px;vertical-align:1px}
  .senses{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.7}
  /* 퀴즈 주관식 입력칸 상태 */
  .qin-ok{border-color:var(--ok)!important;background:var(--ok-bg);color:var(--ok);font-weight:600}
  .qin-no{border-color:var(--no)!important;background:var(--no-bg)}
  .qstep{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin:0 2px 6px}
  /* 복습 퀴즈 */
  .qblank{display:inline-block;min-width:64px;border-bottom:2px solid var(--warn);
    color:var(--warn);text-align:center;font-weight:700;letter-spacing:2px;transition:color .2s,border-color .2s}
  .qblank.okfill{color:var(--ok);border-color:var(--ok)}
  .qblank.nofill{color:var(--no);border-color:var(--no)}
  .qhint{font-size:13px;color:var(--sub);margin:10px 2px 4px}
  .qtry{font-size:12.5px;font-weight:700;color:var(--no);min-height:18px;margin:6px 2px 0}
  /* 정답/오답 하단 배너 (듀오링고식) */
  .qban{position:fixed;left:0;right:0;bottom:58px;max-width:var(--w);margin:0 auto;z-index:30;
    transform:translateY(130%);transition:transform .3s cubic-bezier(.22,1,.36,1);
    padding:14px 18px 16px;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:12px;
    box-shadow:0 -6px 24px rgba(0,0,0,.08)}
  .qban.show{transform:translateY(0)}
  .qban.ok{background:var(--ok-bg)} .qban.no{background:var(--no-bg)}
  .qban .bi{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:17px;flex:0 0 auto}
  .qban.ok .bi{background:var(--ok);animation:bpop .5s cubic-bezier(.22,1.6,.36,1)}
  .qban.no .bi{background:var(--no)}
  .qban .btxt{flex:1;font-weight:800;font-size:14.5px;line-height:1.4}
  .qban.ok .btxt{color:var(--ok)} .qban.no .btxt{color:var(--no)}
  .qban .btxt small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
  @keyframes bpop{0%{transform:scale(0)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
  .shakeX{animation:shakeX .32s}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
  .glowOK{box-shadow:0 0 0 2px var(--ok),0 10px 28px rgba(58,125,93,.22)!important}
  /* 진단 스코어 헤더 */
  .fbseg{display:flex;gap:3px;height:9px;border-radius:999px;overflow:hidden;margin:10px 0 7px}
  .fbseg i{flex:1}
  /* 원문 오독 구간 하이라이트 */
  .esp{border-radius:4px;padding:0 2px}
  .esp.k-voc{background:var(--warn-bg);box-shadow:inset 0 -2px 0 var(--warn)}
  .esp.k-gram{background:var(--no-bg);box-shadow:inset 0 -2px 0 var(--no)}
  .esp.k-ref{text-decoration:underline dotted 2px var(--no);text-underline-offset:3px}
  .esplegend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin:2px 2px 10px;flex-wrap:wrap}
  .esplegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  /* 홈: 주간 잔디 + 숙제 칩 */
  .wdots{display:flex;gap:6px;margin-top:8px}
  .wdots .wd{width:18px;height:18px;border-radius:6px;background:var(--line)}
  .wdots .wd.on{background:var(--accent)}
  .wdots .wd.today{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:1px}
  .chip2{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;
    background:var(--bg);border:1px solid var(--line);color:var(--sub)}
  .chip2.ok{background:var(--ok-bg);border-color:var(--okb);color:var(--ok)}
  .chip2.hwmark{background:var(--warn-bg);border-color:var(--warnb);color:var(--warn);margin-left:6px}
  .psg.hw{border-color:#cfe3d8;background:var(--card)}
  /* 학습 코스 레일 */
  .cstep{display:flex;gap:12px}
  .crail{flex:0 0 28px;display:flex;flex-direction:column;align-items:center}
  .cnd{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:var(--line);color:var(--sub);flex:0 0 auto}
  .cnd.done{background:var(--accent);color:#fff}
  .cnd.now{background:var(--card);border:2px solid var(--accent);color:var(--accent)}
  .cbar{width:2px;flex:1;background:var(--line);min-height:14px}
  .cbar.done{background:var(--accent)}
  .cbody{flex:1;min-width:0;padding-bottom:12px}
  /* AI 진단 */
  .fb{border:1px solid var(--line);border-left:4px solid var(--line);background:var(--card);
    border-radius:12px;padding:11px 14px;margin-bottom:8px}
  .fb.good{border-left-color:var(--ok)} .fb.partial{border-left-color:var(--warn)} .fb.missed{border-left-color:var(--no)}
  .fb .vlb{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;background:var(--sub)}
  .fb.good .vlb{background:var(--ok)} .fb.partial .vlb{background:var(--warn)} .fb.missed .vlb{background:var(--no)}
  .fb .en{font-size:14px;margin-top:7px}
  .fb .my{font-size:13px;color:var(--sub);margin-top:5px}
  .fb .note{font-size:13px;color:var(--ink);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);line-height:1.6}
  .fb .note .lb,.fb .my .lb{font-size:11px;font-weight:700;opacity:.7;margin-right:5px}
  .fb .cause{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px;white-space:nowrap;
    background:var(--warn-bg);color:var(--warn)}
  .fb .cause.ok{background:var(--ok-bg);color:var(--ok)}
  .fb .cause.no{background:var(--no-bg);color:var(--no)}
  .fbsum{border:1px solid var(--okb);background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.7}
  .fbsum .t{font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .fblb{display:block;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.07em;margin:11px 0 2px}
  .fblb.warn2{color:var(--warn)}
  .retryhint{border:1px solid var(--warnb);background:var(--warn-bg);border-radius:12px;
    padding:10px 13px;margin:0 0 12px;font-size:13px;color:var(--ink);line-height:1.6}
  .retryhint .lb{font-weight:700;color:var(--warn);margin-right:5px}
  /* 다시 읽을 문장 창고 */
  .storehead{display:flex;align-items:baseline;gap:8px;margin:4px 2px 10px}
  .storehead .t{font-size:13px;font-weight:700;color:var(--ink)}
  .storehead .more{margin-left:auto;font-size:12px;color:var(--sub);cursor:pointer}
  .storehead .more:hover{color:var(--accent)}
  .stitem{display:flex;gap:11px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
    cursor:pointer;color:var(--ink);font-family:inherit}
  .stitem:hover{border-color:var(--accent)}.stitem:active{transform:scale(.99)}
  .stitem.done{opacity:.7}
  .stitem .miss{flex:0 0 auto;align-self:flex-start;margin-top:1px;font-size:11px;font-weight:700;
    color:#fff;background:var(--no);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .stitem.done .miss{background:var(--ok)}
  .stitem .body{display:block;flex:1;min-width:0}
  .stitem .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
  .stitem .tag{font-weight:700;color:var(--warn)}
  .stitem .en{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;margin-top:5px;line-height:1.55}
  /* 오늘의 루틴 */
  .rt{border:1px solid var(--line);background:var(--card);border-radius:16px;
    padding:2px 15px 4px;margin-bottom:14px;box-shadow:var(--shadow)}
  .rthead{display:flex;align-items:center;gap:8px;padding:13px 0 3px;font-weight:700;font-size:14px}
  .rthead .n{margin-left:auto;font-size:12px;color:var(--sub)}
  .rtrow{display:flex;align-items:center;gap:11px;padding:12px 0;font-size:14px}
  .rtrow+.rtrow{border-top:1px solid var(--line)}
  .rtrow .bx{flex:0 0 20px;height:20px;border-radius:6px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center}
  .rtrow.ok .bx{background:var(--accent);border-color:var(--accent)}
  .rtrow.ok .bx .ic{width:12px;height:12px;stroke:#fff;stroke-width:3.5}
  .rtrow .k{flex:0 0 46px;font-weight:700}
  .rtrow .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;

  .rtrow.ok .k{color:var(--sub)}
  .rtrow.auto{opacity:.55}
  .rtrow .go{flex:0 0 auto;font-size:12px;font-weight:700;color:#fff;background:var(--accent);

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}

  .tagbar .n{flex:0 0 auto;font-weight:700;font-size:12px;color:var(--accent)}
  /* ===== Reviewer 톤 (2026-09-29): 모노톤·선만·그림자 없음, 초록은 버튼·진행·좋은 판정에만 ===== */

  .rstep .nd{width:16px;height:16px;margin-top:3px;border-radius:999px;border:2px solid var(--grip);background:var(--card);
    box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:border-color .15s,background .15s}
  .rstep .ln{width:2px;flex:1;background:var(--line);margin:4px 0}
  .rstep.done .nd{border:0;background:var(--accent)}

  .rstep.done .ln{background:var(--accent)}
  .rstep.now .nd{border-color:var(--accent)}
  .rstep.now .nd::after{content:"";width:6px;height:6px;border-radius:999px;background:var(--accent)}

  /* 다시 볼 문장: 문장 밑 AI 진단 */

  .rdiag .cause{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-right:6px;background:var(--warn-bg);color:var(--warn)}
  .rdiag .cause.ok{background:var(--ok-bg);color:var(--ok)}

  /* 진단 막대: 누르면 그 문장만 */
  .fbbars{display:grid;gap:4px;margin:4px 0 8px}

    background:none;color:var(--sub);font:inherit;font-size:11px;font-variant-numeric:tabular-nums;cursor:pointer}
  .fbbar i{display:block;width:100%;height:8px;border-radius:3px}

  .fbbars.pick .fbbar:not(.on){color:var(--grip)}

  .fbbar:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  /* 폰: 겹치는 안쪽 여백 줄이기 (맨 끝에 둬야 앞 규칙을 이긴다) */
  @media (max-width:480px){

<!-- 하단 탭바 -->
<div id="tabbar" class="tabbar" style="display:none">
  <button class="tab active" data-t="home" onclick="navTab('home')"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>홈</span></button>

  <button class="tab" data-t="vocab" onclick="navTab('vocab')"><svg class="ic" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>단어장</span></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const app=document.getElementById('app');
let state=[], current=null, allP=[], session=null, wrongIds=new Set(), myAtts=[], solving=false;
let everWrong=new Set();   // 이번 세션에서 한 번이라도 자리를 틀린 문장(원래 인덱스)
// 독해 모드
let myReadings=[], vocab=[], readIds=new Set();
let rP=null, rIdx=0, rInterp=[], rUnder=[], rReact=[], rMarks=[], rTopic='', rActive=false;
let rSeq=[], rRetryFb=null;   // rSeq: 이번에 읽을 문장 번호들(다시 독해면 일부만)
// 단어장·복습 퀴즈
let myVocab=[], vocabLegacy=false;
let qDeck=[], qIdx=0, qCur=null, qRight=[], qWrongList=[], qSoftList=[], qActive=false, qAnswered=false, qPractice=false;
// AI 독해 진단
let myFeedback=[];
// 숙제·코스
let myAsg=[], curCourse=null;

function nat(a,b){return String(a||'').localeCompare(String(b||''),'ko',{numeric:true,sensitivity:'base'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const PATHS={
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  rotate:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  check:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  cursor:'<path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>',
  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  exit:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'
};
function ic(name,extra){return `<svg class="ic ${extra||''}" viewBox="0 0 24 24">${PATHS[name]||''}</svg>`;}

// ---------- 온보딩 (첫 방문 안내) ----------
const OB_KEY='so_onboarded_v1';
function demoHTML(){return `<div class="demo">
  <div class="demo-row"><span class="g">⠿</span> 첫 번째 문장</div>
  <div class="demo-row"><span class="g">⠿</span> 두 번째 문장</div>
  <div class="demo-row move"><span class="g">⠿</span> 이 문장을 위로</div>
</div>`;}
function motion2HTML(){return `<div class="demo2">
  <div class="drow"><span class="dcap">끌어서</span><div class="dcard drag"><span class="g">⠿</span> 문장</div></div>
  <div class="drow"><span class="dcap">또는</span><div class="dcard arr"><span>문장</span><span class="ac"><span class="up">▲</span><span>▼</span></span></div></div>
</div>`;}
function reflectDemoHTML(){return `<div class="rdemo">
  <div class="rq">“왜 이 문장이 여기에 올까요?”</div>
  <div class="rwrite"><div class="rfill"></div><svg class="ic ok rpen" viewBox="0 0 24 24" style="width:15px;height:15px">${PATHS.edit}</svg></div>
</div>`;}
const OB=[
  {v:demoHTML, t:'순서를 맞추는 연습', d:'흩어진 영어 문장을 올바른 순서로 배열하는 거예요.'},
  {v:motion2HTML, t:'끌거나 화살표로 이동', d:'⠿ 손잡이를 잡고 끌거나, ▲ ▼ 버튼으로 위치를 옮기세요.'},
  {v:reflectDemoHTML, t:'왜 그런지 적어보기', d:'순서를 맞추면 “확인”! 틀렸던 문장은 왜 그 자리인지 이유도 적어봐요.'}
];
let obStep=0;
function showOnboarding(){
  obStep=0;
  let el=document.getElementById('ob');
  if(!el){ el=document.createElement('div'); el.id='ob'; el.className='ob'; document.body.appendChild(el); }
  obRender();
}
function obRender(){
  const s=OB[obStep], last=obStep===OB.length-1;
  const dots=OB.map((_,i)=>`<i class="${i===obStep?'on':''}"></i>`).join('');
  document.getElementById('ob').innerHTML=`<div class="ob-card">
    ${s.v()}
    <h3>${s.t}</h3>
    <p>${s.d}</p>
    <div class="ob-dots">${dots}</div>
    <div class="ob-btns">
      <button class="btn ghost" style="flex:1" onclick="obClose()">건너뛰기</button>
      <button class="btn primary" style="flex:1" onclick="${last?'obClose()':'obNext()'}">${last?'시작하기':'다음'}</button>
    </div>
  </div>`;
}
function obNext(){ obStep++; obRender(); }
function obClose(){ try{ localStorage.setItem(OB_KEY,'1'); }catch(_){} const el=document.getElementById('ob'); if(el) el.remove(); }

// ---------- 인증 ----------
async function init(){
  if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.includes('여기에')){
    app.style.display='block';
    app.innerHTML=`<div class="empty">아직 Supabase 연결 전이에요.<br>config.js에 키를 넣어주세요.</div>`;
    return;
  }
  const { data:{ session:s } } = await db.auth.getSession();
  s ? enter(s) : showLogin();
}
let authMode='login';
function setMode(m){
  authMode=m;
  $('tabLogin').classList.toggle('active',m==='login');
  $('tabSignup').classList.toggle('active',m==='signup');
  $('authbtn').textContent = m==='login' ? '로그인' : '회원가입';
  $('authhint').textContent = m==='signup' ? '가입하면 바로 시작할 수 있어요.' : '';
  $('name').style.display = m==='signup' ? 'block' : 'none';
  $('nameLabel').style.display = m==='signup' ? 'block' : 'none';
  $('loginmsg').innerHTML='';
}
function submitAuth(){ authMode==='login' ? login() : signup(); }
function setBusy(btn,on,txt){
  if(!btn) return;
  if(on){ btn.dataset.label=btn.textContent; btn.textContent=txt||'처리 중…'; btn.disabled=true; }
  else { btn.textContent=btn.dataset.label||btn.textContent; btn.disabled=false; }
}

async function login(){
  const email=$('email').value.trim(), password=$('pw').value;
  const btn=$('authbtn'); setBusy(btn,true,'로그인 중…');
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if(error){ setBusy(btn,false); $('loginmsg').innerHTML=`<div class="msg err">${error.message}</div>`; return; }
  enter(data.session);
}
async function signup(){
  const name=$('name').value.trim();
  const email=$('email').value.trim(), password=$('pw').value;
  if(!name){ $('loginmsg').innerHTML=`<div class="msg err">이름을 입력하세요</div>`; return; }
  if(!email){ $('loginmsg').innerHTML=`<div class="msg err">이메일을 입력하세요</div>`; return; }
  if(password.length<6){ $('loginmsg').innerHTML=`<div class="msg err">비밀번호는 6자 이상이어야 해요</div>`; return; }
  const btn=$('authbtn'); setBusy(btn,true,'가입 중…');
  const { data, error } = await db.auth.signUp({ email, password, options:{ data:{ name } } });
  if(error){ setBusy(btn,false); $('loginmsg').innerHTML=`<div class="msg err">${error.message}</div>`; return; }
  if(data.session){ enter(data.session); }          // 이메일 확인 OFF → 바로 입장
  else {                                            // 이메일 확인 ON → 안내
    setBusy(btn,false);
    $('loginmsg').innerHTML=`<div class="msg okmsg">가입됐어요! 이제 '로그인' 탭에서 로그인하세요.</div>`;
    setMode('login');
  }
}
async function logout(){ await db.auth.signOut(); location.reload(); }
function showLogin(){ $('login').style.display='block'; app.style.display='none'; }
function enter(s){
  session=s; $('login').style.display='none'; app.style.display='block'; loadData();
  let seen=true; try{ seen=!!localStorage.getItem(OB_KEY); }catch(_){}
  if(!seen) showOnboarding();
}
function $(id){return document.getElementById(id);}

// ---------- 데이터 로드 + 탭 ----------
let curTab='home';
async function loadData(){
  app.innerHTML=`<div class="loading"><span class="spinner"></span>불러오는 중…</div>`;
  const [pRes,aRes,rRes,vRes,fRes,gRes,dRes,poRes]=await Promise.all([
    db.from('passages').select('*'),
    db.from('attempts').select('*').order('created_at',{ascending:false}),
    db.from('readings').select('*').order('created_at',{ascending:false}),
    db.from('vocab_words').select('*').eq('user_id',session.user.id),
    db.from('reading_feedback').select('*').order('created_at',{ascending:false}),
    db.from('assignments').select('*').order('created_at',{ascending:false}),
    db.from('routine_days').select('*').eq('user_id',session.user.id),
    db.from('routine_pool').select('*').eq('student_id',session.user.id)
  ]);
  myAsg=(!gRes.error&&gRes.data)?gRes.data.filter(a=>a.student_id===session.user.id):[];
  if(pRes.error){ app.innerHTML=`<div class="empty">불러오기 실패 😢<br>${pRes.error.message}</div>`; return; }
  allP=pRes.data||[];
  myAtts=(!aRes.error&&aRes.data)?aRes.data:[];
  myReadings=(!rRes.error&&rRes.data)?rRes.data:[];   // readings 표 없으면 조용히 빈 배열
  readIds=new Set(myReadings.map(r=>r.passage_id));
  vocabLegacy=!!vRes.error;                            // vocab_words 표 없으면 옛 방식으로
  myVocab=(!vRes.error&&vRes.data)?vRes.data:[];
  myFeedback=(!fRes.error&&fRes.data)?fRes.data.filter(f=>f.user_id===session.user.id):[];
  if(!vocabLegacy) await syncVocab();                  // 예전 형광펜 단어 자동 이전
  // 내 최신 시도 기준 오답 지문
  wrongIds=new Set();
  const latest={};
  for(const a of myAtts){ if(!(a.passage_id in latest)) latest[a.passage_id]=a; }
  for(const pid in latest){ if(!latest[pid].is_correct) wrongIds.add(pid); }
  // 루틴 표가 없으면(SQL 미실행) 조용히 꺼진다 — 홈은 예전 모습 그대로
  routineMissing=!!dRes.error||!!poRes.error;
  myDays=(!dRes.error&&dRes.data)?dRes.data:[];
  myPool=(!poRes.error&&poRes.data)?poRes.data:[];
  await ensureRoutine();
  showTab(curTab);
}
function showTabBar(on){ const t=$('tabbar'); if(t) t.style.display=on?'flex':'none'; }
function showTab(t){
  curTab=t;
  document.querySelectorAll('#tabbar .tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  removeBar(); showTabBar(true);
  if(t==='wrong') renderWrong();
  else if(t==='me') renderMe();
  else if(t==='vocab') renderVocabTab();
  else if(t==='learn'){ curCourse?renderCourse():renderLearn(); }
  else renderHome();
}
function myDisplayName(){
  return session?((session.user.user_metadata&&session.user.user_metadata.name)||session.user.email):'';
}
function topBar(){
  const initial=(myDisplayName()||'?').trim().charAt(0).toUpperCase();
  return `<div class="topmenu"><button class="avatarbtn" onclick="openMenu()" aria-label="내 메뉴">${esc(initial)}</button></div>`;
}
// ---------- 프로필 바텀 시트 메뉴 ----------
function openMenu(){
  const name=myDisplayName(), email=session?session.user.email:'';
  const initial=(name||'?').trim().charAt(0).toUpperCase();
  let el=document.getElementById('sheet');
  if(!el){ el=document.createElement('div'); el.id='sheet'; el.className='sheeto'; document.body.appendChild(el); }
  el.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <div class="grab"></div>
    <div class="sprofile">
      <span class="avatarbtn" style="width:42px;height:42px;cursor:default">${esc(initial)}</span>
      <span><span style="display:block;font-weight:700;font-size:15px">${esc(name)}님</span>
        <span class="hint" style="margin:0">${esc(email)}</span></span>
    </div>
    <button class="sitem" onclick="toggleTheme()">${ic('moon','muted')} 다크 모드
      <span class="sw ${isDarkNow()?'on':''}" id="swTheme"><i></i></span></button>
    <button class="sitem" onclick="closeMenu();showOnboarding()">${ic('book','muted')} 사용법 다시 보기</button>
    <button class="sitem out" onclick="logout()">${ic('exit','')} 로그아웃</button>
  </div>`;
  el.classList.add('show');
  el.onclick=closeMenu;
}
function closeMenu(){ const el=document.getElementById('sheet'); if(el) el.classList.remove('show'); }
// ---------- 테마 (자동 감지 + 수동 전환, 기기별 기억) ----------
function isDarkNow(){
  const t=document.documentElement.dataset.theme;
  if(t) return t==='dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme(){
  const next=isDarkNow()?'light':'dark';

// ---------- 오늘의 루틴 ----------
// 하루 경계는 자정이 아니라 새벽 2시. 밤 12시 넘겨 공부해도 그날로 쳐준다.
// 바꿀 일이 있으면 DAY_START 한 곳만 고칠 것 (스트릭·주간 잔디도 같이 따라온다).
const DAY_START=2;
let myDays=[], myPool=[], routineMissing=true;
function routineDate(at){
  const d=at?new Date(at):new Date();
  d.setHours(d.getHours()-DAY_START);
  return dstr(d);
}
const RT={reading:{k:'독해'},retry:{k:'재독해'},vocab:{k:'단어'}};
function todayRow(kind){ const t=routineDate(); return myDays.find(d=>d.log_date===t&&d.kind===kind); }
// 완료 판정. 지난 날은 done_at만 인정한다 — 몰아하기로 지난 칸을 채울 수 없다.
function routineDone(d){
  if(d.done_at) return true;
  if(!d.payload) return true;                       // 재료가 없던 날은 자동 완료
  if(d.log_date!==routineDate()) return false;
  const on=r=>r.user_id===session.user.id&&routineDate(r.created_at)===d.log_date;
  if(d.kind==='reading')
    return myReadings.some(r=>on(r)&&r.passage_id===d.payload.passage_id&&!r.is_retry);
  if(d.kind==='retry')
    return myReadings.some(r=>on(r)&&r.passage_id===d.payload.passage_id&&r.is_retry);
  if(d.kind==='vocab'){
    const t=todayStr();
    return (d.payload.word_ids||[]).every(id=>{
      const v=myVocab.find(x=>x.id===id);
      return !v||(v.next_due&&v.next_due>t);        // 지워진 단어는 통과로 본다
    });
  }
  return false;
}
// 재독해 재료 — 창고 1등이 속한 지문에서 1~2문장.
// readings가 passage_id를 하나만 가져서, 하루치는 반드시 같은 지문에서 뽑아야 한다.
function pickRetryPayload(){
  const {open}=sentenceStore();
  if(!open.length) return null;
  const t=routineDate(), recent=new Set();
  for(const d of myDays){
    if(d.kind!=='retry'||!d.payload||!d.payload.passage_id) continue;
    if(Math.round((new Date(t)-new Date(d.log_date))/86400000)>3) continue;
    for(const i of (d.payload.indexes||[])) recent.add(d.payload.passage_id+'#'+i);
  }
  let cand=open.filter(e=>!recent.has(e.passage_id+'#'+e.index));
  if(!cand.length) cand=open;                       // 후보가 모자라면 제한을 푼다
  const head=cand[0];
  const same=cand.filter(e=>e.passage_id===head.passage_id).slice(0,2);
  return { passage_id:head.passage_id, indexes:same.map(e=>e.index).sort((a,b)=>a-b) };
}
// 안 하고 넘어간 독해 하나 — 오래된 것부터. 없으면 null.
// ⚠️ 배급 판정이 served_on(나갔는가) 하나뿐이라, 예전에는 손도 안 댄 지문이 그대로
//    흘러갔다. 실제로 7일 중 3일치가 그렇게 샜다. 그래서 새 지문보다 이걸 먼저 낸다.
//    "그날 칸을 나중에 채울 수 있다"는 뜻은 아니다. 지난 칸은 여전히 done_at만 인정한다.
function carriedOver(){
  const t=routineDate();
  // 읽기만 하면 풀린다 — 어느 날 읽었든 그 지문은 더 안 끌고 온다 (같은 지문 무한 반복 방지)
  const readDone=new Set(myReadings.filter(r=>!r.is_retry).map(r=>r.passage_id));
  return myDays
    .filter(d=>d.kind==='reading'&&d.log_date<t&&!d.done_at
      &&d.payload&&d.payload.passage_id
      &&!readDone.has(d.payload.passage_id)
      &&allP.some(p=>p.id===d.payload.passage_id))   // 지워진 지문은 건너뛴다
    .sort((a,b)=>a.log_date<b.log_date?-1:1)[0]||null;
}
// 접속할 때 세 칸을 검사해 없으면 그 자리에서 뽑는다. 재료가 없으면 바로 완료로 켜준다.
async function ensureRoutine(){
  if(routineMissing||!session) return;
  const t=routineDate(), rows=[];
  let servedPool=null;
  if(!todayRow('reading')){
    const missed=carriedOver();                     // 놓친 게 있으면 그것부터. 풀은 안 건드린다
    if(missed){
      rows.push({kind:'reading',
        payload:{...missed.payload,carried_from:missed.log_date}});
    }else{
      const next=myPool.filter(r=>!r.served_on&&allP.some(p=>p.id===r.passage_id))
        .sort((a,b)=>(a.sort||0)-(b.sort||0))[0];
      if(next){                                     // 지문이 떨어지면 행을 안 만든다 (홈에 경고)
        servedPool=next;
        rows.push({kind:'reading',payload:{passage_id:next.passage_id,pool_id:next.id}});
      }
    }
  }
  if(!todayRow('retry')){
    const pick=pickRetryPayload();
    rows.push({kind:'retry',payload:pick,done_at:pick?null:new Date().toISOString()});
  }
  if(!todayRow('vocab')){
    const due=vocabLegacy?[]:pickDailyVocab();
    rows.push({kind:'vocab',payload:due.length?{word_ids:due.map(v=>v.id)}:null,
      done_at:due.length?null:new Date().toISOString()});
  }
  if(rows.length){
    const { error } = await db.from('routine_days')
      .upsert(rows.map(r=>({user_id:session.user.id,log_date:t,...r})),
        {onConflict:'user_id,log_date,kind',ignoreDuplicates:true});
    if(error){ routineMissing=true; return; }
    const { data } = await db.from('routine_days').select('*').eq('user_id',session.user.id);
    if(data) myDays=data;
    // 배급이 실제로 기록된 뒤에만 풀에서 뺀다 (행 없이 지문만 소모되는 일이 없게)
    if(servedPool&&todayRow('reading')){
      await db.from('routine_pool').update({served_on:t}).eq('id',servedPool.id);
      servedPool.served_on=t;
    }
  }
  await syncRoutineDone();
}
// 한 바퀴 돌았으면 그 자리에서 완료로 찍는다.
// ⚠️ 단어 칸을 "배급된 단어가 전부 다음 복습일로 넘어감"으로만 판정하면,
//    하나라도 틀린 날은 그 단어가 오늘 다시 나오므로(next_due=오늘) 칸이 영영 안 켜진다.
//    틀린 건 내일 또 나오면 되는 것이지, 그날 복습을 안 한 게 아니다.
async function stampRoutineDone(kind,ref){
  if(routineMissing||!session) return;
  const d=todayRow(kind);
  if(!d||d.done_at) return;
  const at=new Date().toISOString();
  const { error } = await db.from('routine_days')
    .update({done_at:at,ref_id:ref||null}).eq('id',d.id);
  if(!error){ d.done_at=at; d.ref_id=ref||null; }
}
// 중간에 나가도 어디까지 갔는지는 남긴다.
// 표를 더 만들지 않고 payload에 얹는다 (payload.word_ids 같은 배급 정보는 그대로 둔다).
// 선생님 화면(admin)도 같은 자리를 읽어 "지금 3/10"을 띄운다.
async function saveRoutineProgress(kind,prog){
  if(routineMissing||!session) return;
  const d=todayRow(kind);
  if(!d||!d.payload||d.done_at) return;
  const cur=d.payload.progress||{};
  if(cur.done===prog.done&&cur.total===prog.total&&cur.step===prog.step) return;   // 값이 같으면 쓰지 않는다
  const payload={...d.payload,progress:{...prog,at:new Date().toISOString()}};
  const { error } = await db.from('routine_days').update({payload}).eq('id',d.id);
  if(!error) d.payload=payload;
}
// 독해는 루틴이 배급한 그 지문일 때만 진행을 남긴다 (딴 지문을 읽는 건 루틴 칸이 아니다)
function saveReadProgress(done,step){
  if(!rActive||!rP||!done) return;   // 0개는 남기지 않는다 (뒤로 갔다고 진행이 깎이면 안 된다)
  const k=rRetryFb?'retry':'reading';
  const d=todayRow(k);
  if(!d||!d.payload||d.payload.passage_id!==rP.id) return;
  saveRoutineProgress(k,{done,total:(rSeq||[]).length,step:step||'문장'});
}
// 증거(제출·복습 상태)로 완료가 확인되면 done_at을 박아둔다. 지난 날은 이 기록만 남는다.
async function syncRoutineDone(){
  if(routineMissing||!session) return;
  const t=routineDate();
  for(const d of myDays){
    if(d.done_at||d.log_date!==t||!d.payload) continue;
    if(!routineDone(d)) continue;
    const at=new Date().toISOString();
    let ref=null;
    if(d.kind==='reading'||d.kind==='retry'){
      const r=myReadings.find(x=>x.user_id===session.user.id&&x.passage_id===d.payload.passage_id
        &&routineDate(x.created_at)===t&&(d.kind==='retry'?x.is_retry:!x.is_retry));
      ref=r?r.id:null;
    }
    const { error } = await db.from('routine_days').update({done_at:at,ref_id:ref}).eq('id',d.id);
    if(!error){ d.done_at=at; d.ref_id=ref; }
  }
}
// 스트릭·잔디의 원천. 세 칸을 다 채운 날만 센다.
function routineDoneDays(){
  const per=new Map();
  for(const d of myDays){
    const e=per.get(d.log_date)||{done:0,total:0};
    e.total++; if(routineDone(d)) e.done++;
    per.set(d.log_date,e);
  }
  const days=new Set();
  for(const [k,e] of per) if(e.total&&e.done===e.total) days.add(k);
  return days;
}
let rtFoldOpen=false;   // 루틴에서 끝낸 줄 펼침 (기본 접힘)

let calOff=0;   // 0 = 이번 달
function calShift(n){ if(calOff+n>0) return; calOff+=n; renderMe(); window.scrollTo({top:0}); }
function routineDayStats(){
  const per=new Map();
  for(const d of myDays){
    const e=per.get(d.log_date)||{done:0,total:0};
    e.total++; if(routineDone(d)) e.done++;
    per.set(d.log_date,e);
  }

function longestStreak(days){
  let best=0,cur=0,prev=null;
  for(const k of [...days].sort()){
    cur=(prev&&Math.round((new Date(k)-new Date(prev))/86400000)===1)?cur+1:1;
    prev=k; if(cur>best) best=cur;
  }
  return best;
}
// 루틴으로 읽은 문장 수 — 독해는 지문 전체, 재독해는 뽑힌 문장만
function routineSentences(){
  let n=0;
  for(const d of myDays){
    if(!d.payload||!routineDone(d)) continue;
    if(d.kind==='reading'){
      const p=allP.find(x=>x.id===d.payload.passage_id); n+=p?p.sentences.length:0;
    }else if(d.kind==='retry') n+=(d.payload.indexes||[]).length;
  }
  return n;
}

// ---------- 홈: 오늘의 루틴 + 이번 차시 숙제 + 스트릭 ----------
function activityDays(){

  for(const r of myReadings) if(r.user_id===session.user.id&&r.created_at) days.add(r.created_at.slice(0,10));

function dstr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function streakCount(days){
  let n=0; const d=new Date(); d.setHours(d.getHours()-DAY_START);   // 하루 경계 = 새벽 2시
  if(!days.has(dstr(d))) d.setDate(d.getDate()-1);   // 오늘 아직 안 했으면 어제부터 셈
  while(days.has(dstr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function asgStatus(a){
  const after=t=>t&&new Date(t)>=new Date(a.created_at);
  const steps=a.steps||[];
  const st={};
  if(steps.includes('order'))
    st.order=myAtts.some(x=>x.user_id===session.user.id&&x.passage_id===a.passage_id&&x.is_correct&&after(x.created_at));
  if(steps.includes('reading'))
    st.reading=myReadings.some(r=>r.user_id===session.user.id&&r.passage_id===a.passage_id&&!r.is_retry&&after(r.created_at));
  st.done=steps.length>0&&steps.every(s=>st[s]);
  return st;
}
function stepName(s){ return s==='order'?'순서':'독해'; }
function renderHome(){
  // 루틴 표가 살아 있으면 스트릭은 루틴 기준. 없으면 예전 활동 기준으로 돈다.

// ---- 다시 읽을 문장 창고 ----
// 표를 새로 만들지 않는다. reading_feedback.sentence_notes를 (지문, 문장번호)로 접어 매번 계산한다.
// 입장 = partial·missed 누적 2회 이상 · 졸업 = 가장 최근 판정이 good (나중에 또 걸리면 자동 복귀)
function sentenceStore(){
  const m=new Map();
  const asc=myFeedback.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  for(const fb of asc) for(const n of (fb.sentence_notes||[])){
    if(!n||typeof n.index!=='number') continue;
    const key=fb.passage_id+'#'+n.index;
    const e=m.get(key)||{passage_id:fb.passage_id,index:n.index,miss:0,
      sentence:'',verdict:null,at:null,skill_tag:''};
    if(n.verdict==='partial'||n.verdict==='missed') e.miss++;
    if(n.verdict) e.verdict=n.verdict;
    e.at=fb.created_at;                        // 마지막으로 진단된 날
    if(n.sentence) e.sentence=n.sentence;
    if(n.skill_tag) e.skill_tag=n.skill_tag;
    m.set(key,e);
  }
  const open=[], cleared=[];
  for(const e of m.values()){
    if(e.miss<2) continue;                     // 한 번 걸린 건 창고에 안 들인다
    const p=allP.find(x=>x.id===e.passage_id); if(!p) continue;
    e.p=p; if(!e.sentence) e.sentence=p.sentences[e.index]||'';
    (e.verdict==='good'?cleared:open).push(e);
  }
  open.sort((a,b)=>b.miss-a.miss||new Date(a.at)-new Date(b.at));   // 많이 걸린 순 → 오래된 순
  cleared.sort((a,b)=>new Date(b.at)-new Date(a.at));
  return {open,cleared};
}

// 지문별 최신 진단 중, 다시 읽을 문장이 남아 있는 것
function readingRetryList(){
  const seen=new Set(), out=[];
  for(const fb of myFeedback){
    if(seen.has(fb.passage_id)) continue; seen.add(fb.passage_id);
    const p=allP.find(x=>x.id===fb.passage_id); if(!p) continue;
    if(!(fb.flagged||[]).length) continue;
    const cleared=myReadings.some(r=>r.user_id===session.user.id&&r.passage_id===fb.passage_id
      &&new Date(r.created_at)>new Date(fb.created_at));   // 진단 이후 다시 제출했으면 해결로 봄
    if(!cleared) out.push({p,fb});
  }
  return out;
}
// 다시 읽을 문장 없이 통과했거나 이미 재제출한 진단들 (열람용)
function diagnosedList(){
  const retryIds=new Set(readingRetryList().map(x=>x.fb.id));
  const seen=new Set(), out=[];
  for(const fb of myFeedback){
    if(seen.has(fb.passage_id)) continue; seen.add(fb.passage_id);
    if(retryIds.has(fb.id)) continue;
    const p=allP.find(x=>x.id===fb.passage_id); if(!p) continue;
    out.push({p,fb});
  }
  return out;
}
const VERDICT={good:{lb:'잘 읽었어요',cls:'good'},partial:{lb:'절반쯤',cls:'partial'},missed:{lb:'다시 보기',cls:'missed'}};
// 원문 위 오독 구간 하이라이트 (어휘=호박 / 구조=적갈 / 지칭=점선)
function espHTML(sentence,spans){
  let safe=esc(sentence||'');
  for(const sp of (spans||[])){
    if(!sp||!sp.text) continue;
    const t=esc(sp.text);
    const cls=sp.kind==='어휘'?'k-voc':sp.kind==='지칭'?'k-ref':'k-gram';
    if(safe.includes(t)) safe=safe.replace(t,`<span class="esp ${cls}">${t}</span>`);
  }
  return safe;
}
// 이 지문의 직전 진단과 비교해 성장 배지 문구 (없거나 후퇴면 null)
function growthBadge(fb){
  const prev=myFeedback.find(f=>f.passage_id===fb.passage_id&&f.id!==fb.id
    &&new Date(f.created_at)<new Date(fb.created_at));
  if(!prev) return null;
  const cnt=x=>(x.sentence_notes||[]).filter(n=>n.verdict==='good').length;
  const d=cnt(fb)-cnt(prev);
  return d>0?`잘 읽은 문장 +${d}`:null;
}

  const segColor={good:'var(--ok)',partial:'var(--warn)',missed:'var(--no)'};
  // 막대를 누르면 그 문장 진단만, 한 번 더 누르면 전체 (처음엔 전체)
  const seg=notes.length?`<div class="fbbars" style="grid-template-columns:repeat(${notes.length},minmax(0,1fr))">${notes.map(n=>

  const counts=['good','partial','missed'].map(v=>notes.filter(n=>n.verdict===v).length);

    ${seg}
    ${notes.length?`<div style="font-size:12px;color:var(--sub);margin-bottom:9px">잘 읽음 ${counts[0]} · 절반쯤 ${counts[1]} · 다시 보기 ${counts[2]}</div>`:''}
    <span class="fblb" style="margin-top:0">총평</span>${esc(fb.summary||'')}
    ${fb.strengths?`<span class="fblb">잘한 점</span>${esc(fb.strengths)}`:''}
    ${fb.improvements?`<span class="fblb warn2">개선할 점</span>${esc(fb.improvements)}`:''}</div>`;
  const hasSpans=notes.some(n=>(n.error_spans||[]).length);
  if(hasSpans) html+=`<div class="esplegend">
    <span><i style="background:var(--warn-bg);box-shadow:inset 0 -2px 0 var(--warn)"></i>어휘 오역</span>

    <span><i style="border-bottom:2px dotted var(--no);border-radius:0"></i>지칭 추론</span></div>`;
  for(const n of notes){
    const v=VERDICT[n.verdict]||VERDICT.partial;
    const my=reading&&(reading.interpretations||[]).find(it=>it.index===n.index);
    html+=`<div class="fb ${v.cls}" data-i="${n.index}"><span class="vlb">${v.lb}</span><span class="hint" style="margin-left:8px">${n.index+1}번째 문장</span>
      <div class="en">${espHTML(n.sentence||p.sentences[n.index]||'',n.error_spans)}</div>
      ${my&&my.my_reading?`<div class="my"><span class="lb">내 해석</span>${esc(my.my_reading)}</div>`:''}
      ${my&&my.my_understanding?`<div class="my"><span class="lb">내 말로</span>${esc(my.my_understanding)}</div>`:''}
      ${my&&my.reaction?`<div class="my"><span class="lb">예시·반응</span>${esc(my.reaction)}</div>`:''}
      ${n.reading_note?`<div class="note"><span class="lb">독해</span>${n.skill_detail?`<span class="cause ${n.verdict==='missed'?'no':''}">${esc(n.skill_tag?n.skill_tag+' · '+n.skill_detail:n.skill_detail)}</span>`:''}${esc(n.reading_note)}</div>`:''}
      ${n.understanding_note?`<div class="note" style="border-top:none;padding-top:0"><span class="lb">이해</span>${n.understanding_type?`<span class="cause ${UTYPE_CLS[n.understanding_type]||''}">${esc(n.understanding_type)}</span>`:''}${esc(n.understanding_note)}</div>`:''}
      ${n.note?`<div class="note"><span class="lb">코치</span>${esc(n.note)}</div>`:''}</div>`;
  }
  html+=`</div>`;   // .fbwrap
  // AI가 발견해 단어장에 자동 등록한 단어들
  const mwSeen=new Set(), mwList=[];
  for(const n of notes) for(const mw of (n.missed_words||[])){
    const k=String(mw.word||'').toLowerCase(); if(!k||mwSeen.has(k)) continue;
    mwSeen.add(k); mwList.push(mw);
  }
  if(mwList.length){
    html+=`<div class="ptitle" style="margin-top:16px">${ic('bookmark','warn')} 헷갈렸던 단어는 단어장에 담아뒀어요</div>`;
    html+=mwList.map(mw=>`<div class="vocab"><div class="w">${esc(mw.word)}${mw.meaning?` <span style="font-weight:400;font-size:13px;color:var(--sub)">${esc(mw.meaning)}</span>`:''}</div></div>`).join('');
  }
  if(opts.retryBtn&&flagged.length)
    html+=`<button class="btn primary full" style="margin-top:14px" onclick="startRetryRead('${fb.id}')">${ic('edit')} 표시된 문장 다시 독해하기 (${flagged.length}문장)</button>`;
  return html;
}

function tryLeave(go){
  if(rActive){
    confirmModal('독해를 아직 제출하지 않았어요.<br>쓴 내용은 자동 저장돼서, 다시 들어오면 이어서 쓸 수 있어요.', ()=>{ saveDraft(); saveReadProgress(rIdx); rActive=false; rRetryFb=null; go(); });
    return;
  }
  if(qActive){
    confirmModal('복습 퀴즈가 진행 중이에요.<br>지금까지 푼 단어까지만 기록돼요.', ()=>{
      if(!qPractice) saveRoutineProgress('vocab',{done:qIdx,total:qDeck.length,step:'단어'});
      qActive=false; go(); });
    return;
  }
  if(solving && !(state.length && state.every((s,i)=>s.idx===i))){
    confirmModal('아직 다 맞히지 못했어요.<br>나가면 지금 배열은 저장되지 않아요.', ()=>{ solving=false; go(); });
    return;
  }
  solving=false; go();
}
function leaveSolve(){ tryLeave(()=>loadData()); }
function leaveRead(){ const t=rRetryFb?'wrong':'learn'; tryLeave(()=>{ curTab=t; loadData(); }); }
function navTab(t){ if(solving||rActive||qActive) tryLeave(()=>{ curTab=t; loadData(); }); else showTab(t); }

function buildGroups(list){
  const sorted=[...list].sort((a,b)=> nat(a.book,b.book)||nat(a.unit,b.unit)||nat(a.title,b.title));
  const map=new Map();
  for(const p of sorted){
    const b=p.book||'미분류', u=p.unit||'';
    if(!map.has(b)) map.set(b,{});
    const units=map.get(b); (units[u]=units[u]||[]).push(p);
  }
  return map;
}

// ---------- 풀이 ----------
function pick(id){
  current=allP.find(p=>p.id===id); if(!current) return;
  solving=true; showTabBar(true);
  everWrong=new Set();
  const sents=current.sentences;
  let order=sents.map((t,i)=>({idx:i,text:t}));
  state=shuffle(order, sents.length);
  render();
}
function shuffle(arr,n){
  let a=arr.slice();
  if(n>1){ do{ for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }while(a.every((x,i)=>x.idx===i)); }
  return a;
}
let _seed=(new Date().getTime?new Date().getTime():12345)%2147483647;
function rnd(){ _seed=(_seed*16807)%2147483647; return (_seed-1)/2147483646; }

// 셸(뒤로가기·제목·보드틀)은 한 번만, 이후엔 보드만 갱신 → 깜빡임·스크롤 튐 방지
function render(checked){
  if(!document.getElementById('boardEl')){

function updateBoard(checked){
  const cards=state.map((s,i)=>{
    let cls='cardx'; if(checked){ cls+= s.idx===i?' ok':' no'; }
    const mark=checked?(s.idx===i?'<span class="mark ok">✓</span>':'<span class="mark no">✗</span>'):'';
    return `<div class="${cls}" data-pos="${i}" data-idx="${s.idx}">
      <span class="grip" aria-label="끌어서 이동">⠿</span><span class="num">${i+1}</span>
      <span class="txt">${esc(s.text)}</span>${mark}
      <span class="arrows">
        <button onclick="move(${i},-1)" ${i===0?'disabled style=opacity:.3':''} aria-label="위로">▲</button>
        <button onclick="move(${i},1)" ${i===state.length-1?'disabled style=opacity:.3':''} aria-label="아래로">▼</button>
      </span></div>`;
  }).join('');
  document.getElementById('boardEl').innerHTML=cards;

  let done='';
  if(checked && state.every((s,i)=>s.idx===i)){
    done=`<div class="done">${ic('check','ok')} 완벽해요! 전부 맞았어요`;
    if(everWrong.size>0) done+=`<div style="margin-top:12px"><button class="btn primary" onclick="renderReflection()">${ic('edit')} 틀렸던 문장, 왜 여기일까 써보기</button></div>`;
    done+=`</div>`;
  }
  document.getElementById('done').innerHTML=done;

  let bar=document.getElementById('bar');
  if(!bar){ bar=document.createElement('div'); bar.id='bar'; bar.className='bar'; document.body.appendChild(bar); }
  const correct=state.filter((s,i)=>s.idx===i).length;
  const allCorrect=correct===state.length;
  let actions;
  if(!checked){
    actions=`<button class="btn ghost" onclick="pick(current.id)">섞기</button>
             <button class="btn primary" onclick="check()">확인</button>`;
  }else if(allCorrect){
    actions=`<button class="btn primary" onclick="pick(current.id)">새로 섞어 다시 풀기</button>`;
  }else{
    actions=`<button class="btn ghost" onclick="pick(current.id)">새로 섞기</button>
             <button class="btn primary" onclick="render()">재시도</button>`;
  }
  bar.innerHTML=`
    <div class="result">${checked?`<b>${correct}/${state.length}</b> 맞았어요`:'순서를 맞춘 뒤 확인하세요'}</div>
    ${actions}`;
  enableDrag();
}

async function check(){

// 포인터 기반 드래그 — 터치(폰)·마우스(노트북) 모두 작동
// 이벤트를 문서 전체에서 받아, 카드가 이동해도 놓기를 놓치지 않음
let dragEl=null;
function enableDrag(){
  const board=document.getElementById('boardEl'); if(!board) return;
  board.querySelectorAll('.grip').forEach(g=>g.addEventListener('pointerdown',gripDown));
}
function gripDown(e){
  e.preventDefault();
  dragEl=e.currentTarget.closest('.cardx'); if(!dragEl) return;
  dragEl.classList.add('dragging');
  document.addEventListener('pointermove',gripMove,{passive:false});
  document.addEventListener('pointerup',gripUp);
  document.addEventListener('pointercancel',gripUp);
}
function gripMove(e){
  if(!dragEl) return;
  e.preventDefault();
  const board=document.getElementById('boardEl'); if(!board) return;
  const y=e.clientY;
  const cards=[...board.querySelectorAll('.cardx')];
  const di=cards.indexOf(dragEl);
  for(let k=0;k<cards.length;k++){
    if(cards[k]===dragEl) continue;
    const r=cards[k].getBoundingClientRect();
    const mid=r.top+r.height/2;
    if(di<k && y>mid){ board.insertBefore(dragEl,cards[k].nextSibling); renumber(board); break; }
    if(di>k && y<mid){ board.insertBefore(dragEl,cards[k]); renumber(board); break; }
  }
}
function renumber(board){
  [...board.querySelectorAll('.cardx')].forEach((c,i)=>{ const n=c.querySelector('.num'); if(n) n.textContent=i+1; });
}
function gripUp(){
  document.removeEventListener('pointermove',gripMove);
  document.removeEventListener('pointerup',gripUp);
  document.removeEventListener('pointercancel',gripUp);
  if(!dragEl) return;

function cleanWord(t){ return String(t).replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,''); }
function placeCaretEnd(el){ try{ el.selectionStart=el.selectionEnd=el.value.length; }catch(_){} }
function hlWord(sentence,w){
  const safe=esc(sentence);
  if(!w) return safe;
  try{
    const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return safe.replace(re,'<mark>$1</mark>');
  }catch(e){ return safe; }
}

function buildVocab(){
  const seen=new Map();
  for(const r of myReadings){
    for(const it of (r.interpretations||[])){
      for(const w of (it.unknown_words||[])){
        const k=String(w).toLowerCase().trim(); if(!k) continue;
        if(!seen.has(k)) seen.set(k,{w:String(w), ex:it.sentence||''});
      }
    }
  }
  vocab=[...seen.values()].sort((a,b)=>a.w.toLowerCase().localeCompare(b.w.toLowerCase()));
}

async function syncVocab(){
  // 예전에 독해에서 형광펜 친 단어들을 단어장 표로 자동 이전
  const have=new Set(myVocab.map(v=>v.word_key)), seen=new Set(), rows=[];
  for(const r of myReadings){
    if(r.user_id!==session.user.id) continue;
    for(const it of (r.interpretations||[])) for(const w of (it.unknown_words||[])){
      const k=String(w).toLowerCase().trim();
      if(!k||have.has(k)||seen.has(k)) continue;
      seen.add(k);
      rows.push({user_id:session.user.id,word:cleanWord(w)||String(w),word_key:k,
        example:it.sentence||'',passage_id:r.passage_id||null});
    }
  }
  if(!rows.length) return;
  try{

      .upsert(rows,{onConflict:'user_id,word_key',ignoreDuplicates:true}).select();
    if(!error&&data) myVocab=myVocab.concat(data);

}

// ---------- 복습 퀴즈 (예문 빈칸 + 간격 반복) ----------
const DAILY_VOCAB=10;   // 하루 몫. 단어마다 3단계라 이보다 늘리면 끝이 안 보인다
const DAILY_NEW=4;      // 그중 처음 보는 단어 몫. 복습이 모자라면 새 단어로, 새 단어가 모자라면 복습으로 채운다
// 하루 몫 고르기. 복습(한 번이라도 답해 본 단어)은 오래 밀린 순, 새 단어는 먼저 형광펜 친 순.
// ⚠️ 예전엔 DB가 돌려준 순서대로 앞 10개를 잘랐다. 앞쪽 단어 20개 남짓이 1일·3일 간격으로
//    계속 자리를 차지해서, 통과해도 같은 세트가 돌고 나머지 200개는 한 번도 안 나왔다 (2026-09-12).
function pickDailyVocab(){
  const due=dueWords(), seen=v=>(v.correct_count||0)+(v.wrong_count||0)>0;
  const rev=due.filter(seen).sort((a,b)=>
    (a.next_due||'').localeCompare(b.next_due||'')||(a.level||0)-(b.level||0));
  const fresh=due.filter(v=>!seen(v)).sort((a,b)=>
    (a.created_at||'').localeCompare(b.created_at||'')||String(a.word_key).localeCompare(String(b.word_key)));
  const nNew=Math.min(fresh.length,Math.max(DAILY_NEW,DAILY_VOCAB-rev.length));
  return rev.slice(0,DAILY_VOCAB-nNew).concat(fresh.slice(0,nNew));
}
// 오늘 풀 단어. 루틴이 배급한 것을 그대로 쓴다 — 홈 카드 숫자와 퀴즈가 어긋나면 안 된다.
// 그중 이미 맞혀서 다음 복습일로 넘어간 것은 빠지고, 틀린 것은 남아 오늘 다시 나온다.
function todayVocabDeck(){
  const due=dueWords();
  const row=routineMissing?null:todayRow('vocab');
  const ids=row&&row.payload?(row.payload.word_ids||[]):null;
  if(ids&&ids.length){
    const pick=ids.map(id=>due.find(v=>v.id===id)).filter(Boolean);
    if(pick.length) return pick;
    return [];                       // 배급분을 다 끝냈다
  }
  return pickDailyVocab();           // 루틴 표가 없을 때
}

// 퀴즈는 단어마다 최대 3단계: ① 뜻 쓰기(주관식, 순서 무관 전부) → ② 문맥 해석(예문마다 어떤 뜻인지) → ③ 빈칸에 단어 쓰기
// 모든 단계를 통과해야 그 단어를 아는 것으로 침. 없는 단계(뜻 정보 없음, 뜻 1개뿐)는 건너뜀
let qMeanOK=true, qCtxOK=true, qTargets=null, qCtxItems=[], qTDone=[], qPhaseTries=0;
let srFail=0;   // 복습 결과 저장에 실패한 횟수 (0이 아니면 결과 화면에서 알린다)
// 우리말 뜻 채점: 괄호 주석·띄어쓰기·문장부호 무시, 쉼표로 나뉜 동의어 중 하나면 정답, 작은 어미 차이 흡수
function normKo(s){ return String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[\s,;·/~\-–—.!?'"’‘…]/g,''); }
function lev1(a,b){                       // 편집거리 1 이하인지 (바라다/바랐다 류)
  if(a===b) return true;
  const la=a.length, lb=b.length;
  if(Math.abs(la-lb)>1) return false;
  let i=0,j=0,diff=0;
  while(i<la&&j<lb){
    if(a[i]===b[j]){i++;j++;continue;}
    if(++diff>1) return false;
    if(la>lb) i++; else if(lb>la) j++; else {i++;j++;}
  }
  return diff+(la-i)+(lb-j)<=1;
}
function matchMean(ans,meaning){
  const a=normKo(ans); if(!a) return false;
  return String(meaning||'').split(/[,;·/]/).map(normKo).filter(Boolean).some(v=>
    a===v||(v.length>=3&&lev1(a,v))||(v.length>=4&&v.includes(a)&&a.length>=v.length-2));
}

function quizSteps(){

}
