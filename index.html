function quizMeanSubmit(){
  // 잠기지 않은 칸을 아직 안 맞힌 뜻과 순서 무관으로 짝지음
  qTargets.forEach((_,i)=>{
    const inp=$('qm_'+i); if(!inp||inp.readOnly) return;
    const val=inp.value.trim(); if(!val) return;
    const hit=qTargets.findIndex((t,ti)=>!qTDone[ti]&&matchMean(val,t.mean));
    if(hit>=0){ qTDone[hit]=true; inp.readOnly=true; inp.classList.remove('qin-no'); inp.classList.add('qin-ok'); }
    else inp.classList.add('qin-no');
  });
  const remaining=qTDone.filter(x=>!x).length;
  if(!remaining){ quizPhaseDone('mean',true); return; }
  qPhaseTries++;
  if(qPhaseTries>=3){ qHardFail=true; quizPhaseDone('mean',false); return; }
  const w=$('qword'); if(w){ w.classList.remove('shakeX'); void w.offsetWidth; w.classList.add('shakeX'); }
  $('qtry').textContent=`아직 ${remaining}개 남았어요 · 남은 기회 ${3-qPhaseTries}번`;
  const open=qTargets.map((_,i)=>$('qm_'+i)).find(x=>x&&!x.readOnly);
  if(open){ open.focus(); if(open.value) open.select(); }
}
// ② 문맥 해석: 독해 진단과 같은 기준으로 AI가 채점(good/partial/missed).
// ⚠️ 예전엔 good이 나올 때까지 무한 재시도였다. "수치"를 "숫자"라고 쓴 것처럼 사실상 맞는 답도
//    partial로 떨어지는데, 통과는 good뿐이라 영영 못 빠져나오고 루틴 전체가 멈췄다. 지금 규칙:
//    · partial → 통과시키되 이유를 보여주고, 그 단어는 내일 다시 (오늘 또 물으면 방금 본 답을 외워 답한다)
//    · missed  → 다시 쓰기. 3번까지만. 넘으면 정답을 보여주고 다음 단계로 (뜻 단계와 같은 규칙)
//    · AI 호출 실패 → 화면에 알리고 통과. 채점을 못 했으니 그 단어는 내일 다시
const CTX_MAX=3;                       // 문맥 단계 최대 시도. 뜻 단계와 같게 맞춘다
let qCtxRound=0, qCtxGrading=false, qCtxSoft=false, qCtxHard=false, qHardFail=false;
async function gradeCtxAI(items){
  const res=await fetch(`${SUPABASE_URL}/functions/v1/clever-api`,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,
      Authorization:'Bearer '+(session&&session.access_token?session.access_token:SUPABASE_ANON_KEY)},
    body:JSON.stringify({type:'grade_ctx',items})
  });
  if(!res.ok) throw new Error('grade '+res.status);
  return res.json();
}
// 문맥에서 뭘 놓쳤는지 그 뜻(sense)에 붙여 둔다. 다음에 같은 단어가 나오면 AI에게 같이 넘겨
// "그때 지적한 부분을 이번엔 챙겼는지"를 보게 한다. senses 안에 넣어 표를 더 만들지 않는다.
async function saveCtxMiss(){
  if(!qCur||!qCur.id||!Array.isArray(qCur.senses)) return;
  try{ await db.from('vocab_words').update({senses:qCur.senses}).eq('id',qCur.id); }catch(_){}
}
function lockCtx(x){
  qTDone[x.i]=true; x.inp.readOnly=true;
  x.inp.classList.remove('qin-no'); x.inp.classList.add('qin-ok');
}
function renderQuizContext(){
  qCtxRound=0; qCtxSoft=false; qCtxHard=false; qTDone=qCtxItems.map(()=>false);
  quizShell(`
    <div class="qstep">${stepLb('문맥')}</div>
    <div class="qhint" style="margin:2px 2px 8px"><b>${esc(qCur.word)}</b>가 각 문장에서 <b>어떤 뜻</b>으로 쓰였는지 적어봐요. AI 선생님이 채점해요</div>
    ${qCtxItems.map((s,i)=>`
      <div class="rsent" style="font-size:15px;line-height:1.8;padding:13px 15px;margin-top:${i?'12px':'0'};margin-bottom:0">${hlWord(s.example,qCur.word)}</div>
      ${s.miss?`<div class="qtry" style="min-height:0;margin:5px 2px 0;font-weight:500;color:var(--warn)">${s.miss.ungraded?'지난번엔 채점을 못 하고 넘어간 문장이에요':`지난번에 반만 맞았던 문장이에요${s.miss.note?` · ${esc(s.miss.note)}`:''}`}</div>`:''}
      <input id="qc_${i}" placeholder="이 문장에서의 뜻" autocomplete="off" style="margin-top:8px">
      <div class="qtry" id="qcn_${i}" style="min-height:0;margin:4px 2px 0;font-weight:500"></div>`).join('')}
    <div class="qtry" id="qtry"></div>
    <div id="qnext"></div>
    <button id="qbtn" class="btn primary full" style="margin-top:10px" onclick="quizCtxSubmit()">확인</button>`);
  quizWireInputs('qc_',quizCtxSubmit);
  const f=$('qc_0'); if(f) f.focus();
}
async function quizCtxSubmit(){
  if(qCtxGrading) return;
  const open=qCtxItems.map((s,i)=>({s,i,inp:$('qc_'+i)})).filter(x=>x.inp&&!x.inp.readOnly);
  if(!open.length) return;
  if(open.some(x=>!x.inp.value.trim())){
    $('qtry').textContent='모든 칸을 채운 뒤 확인을 눌러요';
    const e=open.find(x=>!x.inp.value.trim()); if(e) e.inp.focus(); return;
  }
  qCtxGrading=true; qCtxRound++;
  const btn=$('qbtn'); setBusy(btn,true,'AI 선생님이 채점 중…');
  let results=null;
  try{
    const out=await gradeCtxAI(open.map(x=>({word:qCur.word,example:x.s.example,target:x.s.meaning,
      answer:x.inp.value.trim(), prev:x.s.miss?{answer:x.s.miss.answer,note:x.s.miss.note||''}:null})));
    // 개수가 모자라면 짝이 어긋나 엉뚱한 칸을 채점하게 된다. 그럴 바엔 채점 못 한 것으로 친다.
    results=(out&&Array.isArray(out.results)&&out.results.length>=open.length)?out.results:null;
  }catch(_){ results=null; }
  qCtxGrading=false; setBusy(btn,false);
  const last=qCtxRound>=CTX_MAX;
  open.forEach((x,k)=>{
    const noteEl=$('qcn_'+x.i);
    const ans=x.inp.value.trim();
    if(!results){                      // AI를 못 불렀다 → 갇히는 것보다 넘어가는 게 낫다
      lockCtx(x); qCtxSoft=true;
      x.s.miss={answer:ans,note:'',at:todayStr(),ungraded:true};
      if(noteEl) noteEl.innerHTML=`<span class="sub">AI 선생님을 못 불러서 이번엔 채점 없이 넘어가요. 이 단어는 내일 다시 나와요</span>`;
      return;
    }
    const r=results[k]||{}, v=r.verdict;
    if(v==='good'){
      const fixed=x.s.miss&&r.prev_fixed==='yes';
      lockCtx(x); delete x.s.miss;     // 제대로 잡았으니 지난 지적은 지운다
      if(noteEl) noteEl.innerHTML=fixed?`<span style="color:var(--ok)">지난번에 짚었던 부분까지 챙겼어요!</span>`:'';
      return;
    }
    if(v==='partial'||last){           // 반만 맞았거나, 마지막 기회를 다 썼거나
      if(v!=='partial'){ qCtxHard=true; qHardFail=true; } else qCtxSoft=true;
      lockCtx(x);
      x.s.miss={answer:ans,note:r.note||'',at:todayStr()};
      if(noteEl) noteEl.innerHTML=`<span style="color:var(--warn)">${esc(r.note||'문맥 속 의미를 절반만 잡았어요')}</span>`;
      return;
    }
    qCtxHard=true; qHardFail=true;     // 아예 다른 뜻 → 오늘 다시 나와야 한다
    x.inp.classList.remove('qin-no'); void x.inp.offsetWidth; x.inp.classList.add('qin-no');
    if(noteEl) noteEl.innerHTML=`<span style="color:var(--warn)">${esc(r.note||'이 문장 상황에 맞는 의미인지 다시 생각해봐요')}</span>`;
  });
  saveCtxMiss();
  const remaining=qTDone.filter(x=>!x).length;
  if(!remaining){
    const clean=qCtxRound===1&&!qCtxSoft&&!qCtxHard;
    quizPhaseDone('ctx',clean,qCtxHard?'hard':'soft');
    return;
  }
  $('qtry').textContent=`아직 ${remaining}개 남았어요 · 남은 기회 ${CTX_MAX-qCtxRound}번`;
  const o=qCtxItems.map((_,i)=>$('qc_'+i)).find(x=>x&&!x.readOnly);
  if(o){ o.focus(); if(o.value) o.select(); }
}
function quizRecapHTML(phase){
  if(phase==='mean')
    return `<div class="vocab" style="margin-top:8px">${sensesHTML(qCur)||`<div class="senses">${esc(qCur.meaning||'')}</div>`}</div>`;
  return `<div class="vocab" style="margin-top:8px">${qCtxItems.map(s=>
    `<div class="senses"><span class="pos">${esc(POS_ABBR[s.pos]||s.pos||'')}</span>${esc(s.meaning)}<div class="ex" style="margin-top:3px">${hlWord(s.example,qCur.word)}</div></div>`).join('')}</div>`;
}
function quizPhaseDone(phase,ok,mode){
  if(phase==='mean') qMeanOK=ok; else qCtxOK=ok;
  const btn=$('qbtn'); if(btn) btn.style.display='none';
  const t=$('qtry'); if(t) t.textContent='';
  const next=(phase==='mean'&&qCtxItems.length)?'renderQuizContext()':'renderQuizCloze()';
  const failMsg=(phase==='ctx'&&mode==='soft')
    ? '통과! 다만 뜻이 살짝 흐렸어요. 아래 뜻을 확인하고, 이 단어는 내일 다시 만나요'
    : '정답을 확인하고 넘어가요. 이 단어는 오늘 다시 나와요';
  $('qnext').innerHTML=`
    ${ok?`<div class="qhint" style="margin:10px 2px 4px;color:var(--ok);font-weight:700">전부 맞았어요!</div>`
       :`<div class="qhint" style="margin:10px 2px 4px">${failMsg}</div>${quizRecapHTML(phase)}`}
    <button class="btn primary full" style="margin-top:10px" onclick="${next}">다음 →</button>`;
}
function renderQuizCloze(){
  removeQBan();
  quizShell(`
    <div class="qstep">${stepLb('빈칸')}</div>
    <div class="rsent" id="qcardEl" style="font-size:17px">${clozeHTML(qCur)}</div>
    <div class="qhint" id="qhint">${quizHintHTML()}</div>
    <input id="qin" placeholder="빈칸에 들어갈 단어" autocomplete="off" autocapitalize="off" style="margin-top:6px">
    <div class="qtry" id="qtry"></div>
    <button id="qbtn" class="btn primary full" style="margin-top:10px" onclick="quizSubmit()">확인</button>`);
  const inp=$('qin'); inp.focus();
  inp.addEventListener('keydown',e=>{ if(e.isComposing) return; if(e.key==='Enter'){ e.preventDefault(); quizSubmit(); } });
}
function quizQuit(){ tryLeave(()=>{ curTab='vocab'; loadData(); }); }
function showQBan(ok,main,sub){
  let el=document.getElementById('qban');
  if(!el){ el=document.createElement('div'); el.id='qban'; document.body.appendChild(el); }
  el.className='qban '+(ok?'ok':'no');
  el.innerHTML=`<div class="bi">${ok?'✓':'✗'}</div>
    <div class="btxt">${main}${sub?`<small>${sub}</small>`:''}</div>
    <button class="btn primary" style="background:${ok?'var(--ok)':'var(--no)'}" onclick="quizNext()">${qIdx+1>=qDeck.length?'결과 보기':'다음'}</button>`;
  requestAnimationFrame(()=>el.classList.add('show'));
}
function removeQBan(){ const el=document.getElementById('qban'); if(el) el.remove(); }
function quizSubmit(){
  if(qAnswered){ quizNext(); return; }
  const inp=$('qin'); const val=cleanWord(inp.value||'').toLowerCase();
  if(!val){ inp.focus(); return; }
  const card=$('qcardEl'), bl=card.querySelector('.qblank');
  if(val===qCur.word_key){
    qAnswered=true;
    const overall=qMeanOK&&qCtxOK;   // 뜻·문맥·빈칸 모든 단계를 첫 시도에 통과해야 정답
    const soft=!overall&&!qHardFail;  // 반만 맞았거나 채점을 못 한 경우 → 오늘 말고 내일 다시
    (overall?qRight:(soft?qSoftList:qWrongList)).push(qCur); updateWordSR(qCur,overall,soft);
    if(bl){ bl.textContent=qCur.word; bl.classList.add('okfill'); }
    if(overall) card.classList.add('glowOK');
    $('qbtn').style.display='none'; $('qtry').textContent='';
    if(overall) showQBan(true, qTries===0?'정답이에요!':'맞았어요! 끝까지 해냈어요',
      qCur.meaning?`${esc(qCur.word)} (${esc(qCur.meaning)})`:'');
    else if(soft) showQBan(true, '여기까지 통과!', '문맥 뜻이 살짝 흐려서 내일 한 번 더 확인할게요');
    else showQBan(false, '빈칸은 맞았는데 뜻이 헷갈렸어요', '뜻까지 잡게 오늘 한 번 더 나와요');
  }else{
    qTries++;
    if(qTries>=4){
      qAnswered=true; qWrongList.push(qCur); updateWordSR(qCur,false);
      if(bl){ bl.textContent=qCur.word; bl.classList.add('nofill'); }
      $('qbtn').style.display='none'; $('qtry').textContent='';
      showQBan(false, `정답은 ${esc(qCur.word)}${qCur.meaning?` (${esc(qCur.meaning)})`:''}`, '오늘 안에 다시 나와요. 그때 잡으면 돼요');
    }else{
      card.classList.remove('shakeX'); void card.offsetWidth; card.classList.add('shakeX');
      $('qhint').innerHTML=quizHintHTML();
      $('qtry').textContent=`아직이에요! 남은 기회 ${4-qTries}번`;
      inp.select();
    }
  }
}
async function updateWordSR(v,ok,soft){
  // 간격 반복: 맞히면 1→3→7→14→30→60일 뒤, 틀리면 처음부터
  // soft = 반만 맞음. 오늘 또 물으면 방금 본 답을 외워 답하므로 단계는 그대로 두고 내일로 미룬다.
  const t=todayStr(); let patch;
  if(ok){
    if(qPractice){ patch={correct_count:(v.correct_count||0)+1}; }
    else{
      const lvl=Math.min((v.level||0)+1,6);
      const d=new Date(); d.setDate(d.getDate()+SR_DAYS[lvl-1]);
      patch={level:lvl,next_due:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
        correct_count:(v.correct_count||0)+1};
    }
  }else if(soft){
    if(qPractice){ patch={wrong_count:(v.wrong_count||0)+1}; }
    else{
      const d=new Date(); d.setDate(d.getDate()+1);
      patch={next_due:dstr(d),wrong_count:(v.wrong_count||0)+1};
    }
  }else{
    patch={level:0,next_due:t,wrong_count:(v.wrong_count||0)+1};
  }
  Object.assign(v,patch);
  // 조용히 삼키면 화면만 멀쩡하고 기록이 안 남는다. 실패는 알린다.
  try{
    const { error } = await db.from('vocab_words').update(patch).eq('id',v.id);
    if(error) srFail=(srFail||0)+1;
  }catch(_){ srFail=(srFail||0)+1; }
}
function quizNext(){
  removeQBan();
  qIdx++;
  if(!qPractice) saveRoutineProgress('vocab',{done:qIdx,total:qDeck.length,step:'단어'});
  if(qIdx<qDeck.length){ renderQuiz(); window.scrollTo({top:0}); }
  else renderQuizEnd();
}
function renderQuizEnd(){
  qActive=false; removeQBan();
  syncRoutineDone();
  if(!qPractice) stampRoutineDone('vocab');   // 연습 말고 오늘 복습을 끝냈으면 칸을 켠다
  const total=qRight.length+qWrongList.length+qSoftList.length;
  const softHtml=qSoftList.length
    ? `<div class="ptitle" style="margin-top:18px">문맥 뜻이 흐렸던 단어는 내일 다시 나와요</div>`+
      qSoftList.map(v=>`<div class="vocab"><div class="w">${esc(v.word)}${v.meaning?` <span style="font-weight:400;font-size:13px;color:var(--sub)">${esc(v.meaning)}</span>`:''}</div>`+
        (Array.isArray(v.senses)?v.senses.filter(s=>s&&s.miss&&s.miss.note).map(s=>`<div class="ex" style="color:var(--warn)">${esc(s.miss.note)}</div>`).join(''):'')+`</div>`).join('')
    : '';
  const wrongHtml=qWrongList.length
    ? `<div class="ptitle" style="margin-top:18px">틀린 단어는 내일 또 나와요</div>`+
      qWrongList.map(v=>`<div class="vocab"><div class="w">${esc(v.word)}${v.meaning?` <span style="font-weight:400;font-size:13px;color:var(--sub)">${esc(v.meaning)}</span>`:''}</div><div class="ex">${hlWord(v.example||'',v.word)}</div></div>`).join('')
    : '';
  app.innerHTML=`
    <div class="done" style="margin-top:20px">${ic('check','ok')} 복습 완료! ${total}개 중 <b>${qRight.length}개</b> 맞았어요</div>
    ${srFail?`<div class="msg err" style="margin-top:10px">기록 저장에 ${srFail}건 실패했어요. 인터넷을 확인하고 다시 한 번 해주세요.</div>`:''}
    ${wrongHtml}
    ${softHtml}
    ${qWrongList.length?`<button class="btn primary full" style="margin-top:14px" onclick="startWrongQuiz()">틀린 것만 바로 다시 (연습)</button>`:''}
    <button class="btn ghost full" style="margin-top:8px" onclick="showTab('vocab')">단어장으로</button>
    <div style="height:40px"></div>`;
}

// ----- 독해 자동저장 (쓰다 만 내용을 기기에 임시저장 → 다시 들어오면 이어서) -----
let rDraftLoaded=false, draftTimer=null;
function draftKey(){ return draftKeyOf(rP.id,rRetryFb,rSeq); }
// 읽기를 시작하지 않은 상태에서도 키를 만들 수 있어야 한다 (홈에서 "이어서" 판단)
function draftKeyOf(pid,fb,seq){
  if(!fb) return `so_rdraft_${session.user.id}_${pid}_full`;
  // 같은 진단이라도 읽는 문장 묶음이 다르면 초안을 분리한다
  // (창고에서 한 문장만 골랐을 때 재독해 초안이 지워지지 않게)
  const flg=[...(fb.flagged||[])].sort((a,b)=>a-b).join('-');
  const cur=[...(seq||[])].sort((a,b)=>a-b).join('-');
  const base=`so_rdraft_${session.user.id}_${pid}_${fb.id}`;
  return cur===flg?base:`${base}_s${cur}`;
}
function draftExists(key){
  try{
    const d=JSON.parse(localStorage.getItem(key)||'null');
    if(!d) return false;
    return (d.interp||[]).some(x=>x)||(d.under||[]).some(x=>x)
      ||(d.react||[]).some(x=>x)||!!d.topic;
  }catch(_){ return false; }
}
function saveDraft(){
  if(!rActive||!rP||!session) return;
  saveReadInputs();
  const t=$('rtopic'); if(t) rTopic=t.value.trim();
  try{ localStorage.setItem(draftKey(),JSON.stringify({
    seq:rSeq, step:t?'topic':'read', idx:rIdx,
    interp:rInterp, under:rUnder, react:rReact, marks:rMarks, topic:rTopic, at:Date.now()
  })); }catch(_){}
}
function saveDraftSoon(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,400); }
function clearDraft(){ clearTimeout(draftTimer); try{ localStorage.removeItem(draftKey()); }catch(_){} }
function loadDraft(){
  rDraftLoaded=false;
  try{
    const d=JSON.parse(localStorage.getItem(draftKey())||'null');
    if(!d) return null;
    if(JSON.stringify(d.seq)!==JSON.stringify(rSeq)){ localStorage.removeItem(draftKey()); return null; } // 지문이 바뀌었으면 버림
    const has=(d.interp||[]).some(x=>x)||(d.under||[]).some(x=>x)||(d.react||[]).some(x=>x)
      ||(d.marks||[]).some(m=>m&&m.length)||d.topic;
    if(!has) return null;
    rIdx=Math.min(d.idx||0,rSeq.length-1);
    rInterp=d.interp||[]; rUnder=d.under||[]; rReact=d.react||[]; rMarks=d.marks||[]; rTopic=d.topic||'';
    rDraftLoaded=true;
    return d;
  }catch(_){ return null; }
}
function draftRestart(){
  clearDraft();
  if(rRetryFb) startRetryRead(rRetryFb.id); else pickRead(rP.id);
}
// 탭을 닫거나 다른 앱으로 나가는 순간에도 마지막 입력을 붙잡아 저장
window.addEventListener('beforeunload',()=>{ if(rActive) saveDraft(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&rActive) saveDraft(); });

// ----- 독해 풀이 -----
function pickRead(id){
  rP=allP.find(p=>p.id===id); if(!rP) return;
  rSeq=rP.sentences.map((_,i)=>i); rRetryFb=null;
  rIdx=0; rInterp=[]; rUnder=[]; rReact=[]; rMarks=[]; rTopic=''; rActive=true;
  const d=loadDraft();
  removeBar(); showTabBar(true);
  if(d&&d.step==='topic') renderTopic(); else renderReadStep();
}
function startRetryRead(fbId){
  const fb=myFeedback.find(f=>f.id===fbId); if(!fb) return;
  rP=allP.find(p=>p.id===fb.passage_id); if(!rP) return;
  rSeq=[...(fb.flagged||[])].sort((a,b)=>a-b).filter(i=>i>=0&&i<rP.sentences.length);
  if(!rSeq.length) return;
  rRetryFb=fb;
  rIdx=0; rInterp=[]; rUnder=[]; rReact=[]; rMarks=[]; rTopic=''; rActive=true;
  loadDraft();
  removeBar(); showTabBar(true);
  renderReadStep();
}

function startSentenceRead(pid,indexes){
  const p=allP.find(x=>x.id===pid); if(!p) return;
  const seq=[...(indexes||[])].sort((a,b)=>a-b).filter(i=>i>=0&&i<p.sentences.length);
  if(!seq.length) return;
  // 힌트와 성장 비교를 위해 이 문장들이 마지막으로 실린 진단을 물려준다 (myFeedback은 최신순)
  const fb=myFeedback.find(f=>f.passage_id===pid
    &&(f.sentence_notes||[]).some(n=>seq.includes(n.index)));
  if(!fb) return;
  rP=p; rSeq=seq; rRetryFb=fb;
  rIdx=0; rInterp=[]; rUnder=[]; rReact=[]; rMarks=[]; rTopic=''; rActive=true;
  loadDraft();
  removeBar(); showTabBar(true);
  renderReadStep();
}
function vocabMeaningOf(token){
  const k=cleanWord(token).toLowerCase(); if(!k) return null;

}

// 단계선: 지금 쓰는 칸 = 초록 점, 채운 칸 = 체크, 빈 칸 = 회색
function updSteps(){

// 진단 원인 이름표 (진단 화면·다시 볼 문장 공용)
const UTYPE_CLS={'예시':'ok','바꿔 말하기':'ok','짧은 문장':'ok','재탕':'','빠뜨림':'no','헛짚음':'no','예시 어긋남':'no'};
function rdiagHTML(n){
  if(!n) return `<div class="rdiag"><span class="hd">AI 진단</span>지난번에 막혔던 문장이에요</div>`;
  let h=`<div class="rdiag"><span class="hd">AI 진단</span>`;
  if(n.reading_note) h+=`<div><span class="lb">독해</span>${n.skill_detail?`<span class="cause ${n.verdict==='missed'?'no':''}">${esc(n.skill_tag?n.skill_tag+' · '+n.skill_detail:n.skill_detail)}</span>`:''}${esc(n.reading_note)}</div>`;
  if(n.understanding_note) h+=`<div><span class="lb">이해</span>${n.understanding_type?`<span class="cause ${UTYPE_CLS[n.understanding_type]||''}">${esc(n.understanding_type)}</span>`:''}${esc(n.understanding_note)}</div>`;
  if(n.note) h+=`<div>${esc(n.note)}</div>`;
  return h+`</div>`;
}
// 오독 구간(error_spans)에 걸치는 단어 번호
function errWordSet(sent,toks,spans){
  const out=new Set();
  if(!spans||!spans.length) return out;
  const pos=[...String(sent).matchAll(/\S+/g)];
  if(pos.length!==toks.length) return out;
  for(const sp of spans){
    const i=String(sent).indexOf(sp.text||''); if(!sp.text||i<0) continue;
    const j=i+sp.text.length;
    pos.forEach((m,wi)=>{ if(m.index<j&&m.index+m[0].length>i) out.add(wi); });
  }
  return out;
}
// ----- 형광펜 뜻 말풍선 -----
// 단어장에 있는 단어면 품사별 뜻을, 처음 보는 단어면 담아둔다는 것만 알려준다.
// (처음 보는 단어의 뜻은 제출 후 AI 진단이 채운다 — 그 전에 알려주면 추론 기록이 오염된다)
function sensesTipHTML(word,ss){
  return `<b>${esc(word)}</b>`+ss.slice(0,3).map(s=>{
    const p=POS_ABBR[s.pos]||s.pos||'';
    return `<i>${p?`<span class="pos">${esc(p)}</span>`:''}${esc(s.meaning)}</i>`;
  }).join('');
}
// 단어장에 있으면 바로, 없으면 엣지 함수에 물어본다 (같은 세션에서는 한 번만)
const glossCache=new Map();
function wordTip(token){
  const w=cleanWord(token); if(!w) return null;
  const k=w.toLowerCase();
  const v=myVocab.find(x=>x.word_key===k);
  const ss=(v&&Array.isArray(v.senses))?v.senses.filter(s=>s&&s.meaning):[];
  if(ss.length) return {word:w,html:sensesTipHTML(w,ss)};
  if(v&&v.meaning) return {word:w,html:`<b>${esc(w)}</b><i>${esc(v.meaning)}</i>`};
  const c=glossCache.get(k);
  if(c) return {word:w,html:sensesTipHTML(c.word||w,c.senses||[])};
  return {word:w,html:`<b>${esc(w)}</b><i class="soft">뜻 찾는 중…</i>`,lookup:true};
}
async function lookupGloss(word,sentence){
  const k=word.toLowerCase();
  if(glossCache.has(k)) return glossCache.get(k);
  const res=await fetch(`${SUPABASE_URL}/functions/v1/clever-api`,{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,
      Authorization:'Bearer '+(session&&session.access_token?session.access_token:SUPABASE_ANON_KEY)},
    body:JSON.stringify({type:'word_gloss',word,sentence})
  });
  if(!res.ok) throw new Error('gloss '+res.status);
  const j=await res.json();
  if(!j||!Array.isArray(j.senses)||!j.senses.length) throw new Error('empty');
  glossCache.set(k,j);
  return j;
}
let tipTimer=null, tipEl=null, tipSpan=null, tipSeq=0;
function hideWordTip(){
  clearTimeout(tipTimer); tipSeq++;
  if(tipEl){ const el=tipEl; tipEl=null; tipSpan=null; el.classList.remove('on');
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },200); }
}
// 단어 위 가운데에 붙이되 화면 밖으로 삐져나가지 않게 좌우를 당겨준다
function placeWordTip(){
  if(!tipEl||!tipSpan) return;
  const r=tipSpan.getBoundingClientRect();
  tipEl.style.top=Math.round(r.top+window.scrollY)+'px';
  tipEl.style.left=Math.round(r.left+r.width/2)+'px';
  const box=tipEl.getBoundingClientRect(), pad=10;
  let shift=0;
  if(box.left<pad) shift=pad-box.left;
  else if(box.right>window.innerWidth-pad) shift=window.innerWidth-pad-box.right;
  if(shift) tipEl.style.left=Math.round(r.left+r.width/2+shift)+'px';
}
function showWordTip(span,html,hold){
  hideWordTip();
  if(!span||!html) return 0;
  const el=document.createElement('div');
  el.className='wtip'; el.innerHTML=html;
  document.body.appendChild(el); tipEl=el; tipSpan=span;
  placeWordTip();
  // rAF는 탭이 비활성이면 안 돌아서 말풍선이 영영 안 뜬다. 리플로우를 강제해 전환만 태운다
  void el.offsetWidth;
  el.classList.add('on');
  if(!hold) tipTimer=setTimeout(hideWordTip,2400);   // 조회 중이면 결과가 온 뒤에 센다
  return tipSeq;
}
// 조회 결과로 내용만 갈아끼운다. 그 사이 다른 단어를 눌렀으면 버린다.
function fillWordTip(seq,html){
  if(!tipEl||seq!==tipSeq) return;
  tipEl.innerHTML=html;
  placeWordTip();
  clearTimeout(tipTimer);
  tipTimer=setTimeout(hideWordTip,2600);
}
window.addEventListener('scroll',hideWordTip,{passive:true});
function updateMarkHelp(){
  const el=$('rhelp'); if(!el) return;
  const c=(rMarks[rIdx]||[]).length;
  el.innerHTML=`${ic('cursor','muted')} 모르는 단어를 눌러 형광펜으로 표시해요${c?` · <span style="color:var(--warn)">${c}개 표시됨</span>`:''}`;
}
function toggleWord(wi){
  const marks=rMarks[rIdx]||(rMarks[rIdx]=[]);
  const at=marks.findIndex(m=>m.i===wi);
  const span=document.querySelectorAll('#rsent .rword')[wi];
  const tok=rP.sentences[rSeq[rIdx]].split(/\s+/)[wi];
  if(at>=0){ marks.splice(at,1); if(span) span.classList.remove('mark'); hideWordTip(); }
  else{
    const w=cleanWord(tok);
    if(!w) return;                       // 순수 기호는 표시 안 함
    marks.push({i:wi,w}); if(span) span.classList.add('mark');
    const tip=wordTip(tok);               // 그 단어 위에 뜻을 잠깐 띄운다
    if(tip){
      const seq=showWordTip(span,tip.html,tip.lookup);
      if(tip.lookup) lookupGloss(tip.word,rP.sentences[rSeq[rIdx]])
        .then(j=>fillWordTip(seq,sensesTipHTML(j.word||tip.word,j.senses)))
        .catch(()=>fillWordTip(seq,`<b>${esc(tip.word)}</b><i class="soft">지금은 못 가져왔어요 · 단어장에 담아둘게요</i>`));
    }
  }
  updateMarkHelp();
  saveDraftSoon();
}
function readKey(e){
  if(e.isComposing) return;              // 한글 입력 중이면 무시
  const t=e.target;                      // 해석 → 설명 → 반응 → 다음 문장 순으로 이동
  const go=()=>{ t.id==='rinput' ? focusEl('runder') : t.id==='runder' ? focusEl('rreact') : readNext(); };
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); go(); }
  else if(e.key==='ArrowRight'){
    if(t.selectionStart===t.value.length && t.selectionStart===t.selectionEnd){ e.preventDefault(); go(); }
  }
}
function focusEl(id){ const r=$(id); if(r){ r.focus(); placeCaretEnd(r); } }
