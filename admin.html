<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온고지신 출제 관리</title>
<style>
  @font-face {
    font-family: 'HsSummerWaterLight';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/HSSummer.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }
  @font-face {
    font-family: '87mmDailyRegular';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201@1.0/87MMILSANG-Regular.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#2b2a27; --sub:#8a877f; --line:#e7e4dc;
    --accent:#2F7A56; --accent-soft:#e4f0e9; --no:#c0584b; --no-bg:#f7e6e3;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  button,input,textarea,select{font-family:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'87mmDailyRegular',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
  .wm{font-family:'HsSummerWaterLight',Batang,serif;font-weight:normal;color:var(--accent);letter-spacing:.08em}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{font-size:13px;color:var(--sub);margin:0 0 22px}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 2px 5px}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;
    padding:12px 13px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink)}
  textarea{resize:vertical;line-height:1.7}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{border:none;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn.small{padding:7px 12px;font-size:13px}
  .btn.danger{background:none;border:1px solid #eecbc4;color:var(--no)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .hint{font-size:12px;color:var(--sub);margin:4px 2px 0}
  .topbar{display:flex;align-items:center;margin-bottom:18px}
  .topbar .who{font-size:13px;color:var(--sub);margin-left:auto}
  .msg{font-size:13px;padding:10px 13px;border-radius:10px;margin:10px 0}
  .msg.ok{background:var(--accent-soft);color:var(--accent)}
  .msg.err{background:#f7e6e3;color:var(--no)}
  .sectiontitle{font-size:14px;font-weight:700;margin:26px 2px 12px}

  /* 자동완성 클립 */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 0}
  .chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;
    padding:5px 12px;font-size:12px;color:var(--ink);cursor:pointer;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.empty{color:var(--sub);border-style:dashed;cursor:default}

  /* 도서관 목록 */
  .book{border:1px solid var(--line);border-radius:14px;background:var(--card);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  .bookh{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;
    padding:14px 16px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
  .bookh .cnt{font-size:12px;font-weight:500;color:var(--sub);margin-left:auto;margin-right:6px}
  .bookh .chev{transition:transform .2s;color:var(--sub)}
  .book.open .bookh .chev{transform:rotate(90deg)}
  .bookbody{display:none;padding:0 14px 12px}
  .book.open .bookbody{display:block}
  .unith{font-size:12px;color:var(--accent);font-weight:600;margin:10px 4px 6px;
    border-left:3px solid var(--accent-soft);padding-left:8px}
  .pi{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);margin-bottom:7px}
  .pi .t{flex:1;font-size:14px}.pi .c{font-size:11px;color:var(--sub);margin-left:6px}

  /* 풀이 기록 / 오답 */
  .rec{border:1px solid #eecbc4;background:var(--no-bg);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .rec.solved{border-color:#bfe0cf;background:var(--accent-soft)}
  .rec .rh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .rec .rh .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--no)}
  .rec.solved .rh .badge{background:var(--accent)}
  .rec .rh .when{margin-left:auto;font-size:11px;color:var(--sub);font-weight:500}
  .ord{display:flex;gap:8px;font-size:13px;padding:6px 9px;border-radius:8px;margin-top:6px;background:#fff}
  .ord .p{flex:0 0 auto;width:20px;text-align:center;color:var(--sub);font-size:12px;align-self:center}
  .ord .s{flex:1}
  .ord .fix{flex:0 0 auto;font-size:11px;color:var(--no);align-self:center}
  .ord.good{opacity:.6}
  .toggle{font-size:12px;color:var(--accent);cursor:pointer;margin-top:8px;display:inline-block}

  /* 통계 대시보드 */
  .statrow{border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .statrow .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .statrow .top b{font-size:14px}
  .statrow .top .pct{margin-left:auto;font-weight:700;font-size:15px}
  .sbarbg{height:8px;background:var(--bg);border-radius:999px;overflow:hidden}
  .sbar{height:100%;border-radius:999px;transition:width .3s}
  .statrow .c{margin-top:7px;font-size:11px;color:var(--sub)}

  /* 단색 라인 아이콘 */
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-2px}
  .ic.muted{stroke:var(--sub)}
  .sectiontitle .ic{vertical-align:-3px;margin-right:3px}

  /* 영역 전환 레이아웃 */
  .adminhead{display:flex;align-items:center;margin-bottom:20px}
  .adminhead .brand{font-size:18px;font-weight:700}
  .adminhead .who{margin-left:auto;font-size:13px;color:var(--sub)}
  .adminhead .who a{color:var(--accent);cursor:pointer}
  .layout{display:flex;gap:24px;align-items:flex-start}
  .side{flex:0 0 170px;display:flex;flex-direction:column;gap:4px;position:sticky;top:18px}
  .navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
    border-radius:10px;padding:11px 13px;font-size:14px;color:var(--sub);cursor:pointer;font-weight:600}
  .navbtn:hover{background:var(--card)}
  .navbtn.active{background:var(--accent-soft);color:var(--accent)}
  .navbtn .ic{stroke:currentColor}
  .main{flex:1;min-width:0}
  .view{display:none} .view.active{display:block}
  /* 학생 메뉴 서브탭 */
  .subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .stab{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sub);
    padding:9px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .stab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .spane{display:none} .spane.active{display:block}
  /* 오늘: 처리 대기열 */
  .kpis{display:flex;gap:10px;margin-bottom:18px}
  .kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 8px;
    text-align:center;box-shadow:var(--shadow)}
  .kpi b{display:block;font-size:21px}
  .kpi span{font-size:11.5px;color:var(--sub)}
  .tq{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);
    transition:opacity .3s,transform .3s}
  .tq.gone{opacity:0;transform:translateX(24px)}
  .tq .tic{flex:0 0 32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px}
  .tq .tg{flex:1;min-width:0}
  .tq .tt{font-weight:600;font-size:14px}
  .tq .ts{font-size:12px;color:var(--sub);margin-top:1px}
  .dline{border-bottom:1px dotted var(--sub);cursor:help}
  .alldone{text-align:center;color:var(--accent);background:var(--accent-soft);border:1px solid #bfe0cf;
    border-radius:13px;padding:22px;font-weight:600;font-size:14px}
  .vtitle{font-size:16px;margin:0 0 14px}
  .subt{font-size:14px;font-weight:700;margin:26px 2px 12px;display:flex;align-items:center;gap:6px}
  @media(max-width:680px){
    .layout{flex-direction:column;gap:14px}
    .side{flex-direction:row;overflow-x:auto;position:static;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
    .navbtn{width:auto;white-space:nowrap;padding:8px 12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="login" style="display:none">
    <h1><span class="wm" style="font-size:22px">온고지신</span> 출제 관리 로그인</h1>
    <p class="sub">채영님만 접속하는 화면이에요</p>
    <div class="card">
      <label>이메일</label>
      <input id="email" type="email" placeholder="chaeyeong03@gmail.com">
      <label>비밀번호</label>
      <input id="pw" type="password" placeholder="Supabase에서 만든 비밀번호">
      <div id="loginmsg"></div>
      <button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">로그인</button>
    </div>
  </div>

  <!-- 관리 -->
  <div id="admin" style="display:none">
    <div class="adminhead">
      <div class="brand"><span class="wm" style="font-size:21px">온고지신</span> 출제 관리</div>
      <div class="who"><span id="who"></span> · <a onclick="logout()">로그아웃</a></div>
    </div>

    <div class="layout">
      <nav class="side">
        <button class="navbtn active" data-v="today" onclick="showView('today')"><svg class="ic" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>오늘</button>
        <button class="navbtn" data-v="student" onclick="showView('student')"><svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>학생</button>
        <button class="navbtn" data-v="passages" onclick="showView('passages')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>지문</button>
        <button class="navbtn" data-v="homework" onclick="showView('homework')"><svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>숙제</button>
      </nav>

      <main class="main">
        <section class="view active" data-view="today">
          <h2 class="vtitle">오늘 확인할 것</h2>
          <div id="todayView"><p class="sub">불러오는 중이에요…</p></div>
        </section>

        <section class="view" data-view="student">
          <h2 class="vtitle">학생</h2>
          <div id="stuProfile"></div>
          <div class="subtabs">
            <button class="stab active" data-s="sins" onclick="showSub('sins')">인사이트</button>
            <button class="stab" data-s="srec" onclick="showSub('srec')">풀이 기록</button>
            <button class="stab" data-s="sread" onclick="showSub('sread')">독해</button>
            <button class="stab" data-s="sfb" onclick="showSub('sfb')">AI 진단</button>
            <button class="stab" data-s="srefl" onclick="showSub('srefl')">이유 쓰기</button>
            <button class="stab" data-s="svoc" onclick="showSub('svoc')">단어장</button>
          </div>
          <div class="spane active" data-s="sins"><div id="insightView"></div></div>
          <div class="spane" data-s="srec"><div id="records"></div></div>
          <div class="spane" data-s="sread"><div id="readings"></div></div>
          <div class="spane" data-s="sfb"><div id="feedbackAdmin"></div></div>
          <div class="spane" data-s="srefl"><div id="reflections"></div></div>
          <div class="spane" data-s="svoc"><div id="vocabAdmin"></div></div>
        </section>

        <section class="view" data-view="passages">
          <h2 class="vtitle">지문 출제·관리</h2>
          <div class="card">
            <div class="row">
              <div>
                <label>교재</label>
                <input id="book" placeholder="예: 수능특강" autocomplete="off" oninput="renderUnitChips()">
                <div class="chips" id="bookChips"></div>
              </div>
              <div>
                <label>강 · 챕터</label>
                <input id="unit" placeholder="예: 3강" autocomplete="off">
                <div class="chips" id="unitChips"></div>
              </div>
            </div>
            <label>지문 번호 · 제목</label>
            <input id="title" placeholder="예: 2번 지문">

            <label>지문 붙여넣기</label>
            <textarea id="raw" rows="5" placeholder="여기에 영어 지문을 붙여넣으세요."></textarea>
            <button class="btn ghost small" style="margin-top:10px" onclick="splitText()"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg> 문장으로 쪼개기</button>

            <div id="splitwrap" style="display:none">
              <label style="margin-top:18px">문장 확인 · 수정 <span class="hint">(카드 안에서 바로 고칠 수 있어요. 줄바꿈하면 그 자리에서 나뉘고, 합치기를 누르면 위 문장과 붙어요)</span></label>
              <div id="sentCards"></div>
              <div id="formmsg"></div>
              <div class="row" style="margin-top:12px">
                <button class="btn primary" onclick="save()">저장하기</button>
                <button class="btn ghost" onclick="save(true)">저장하고 바로 숙제 내주기</button>
                <button class="btn ghost" onclick="resetForm()">취소</button>
              </div>
            </div>
          </div>

          <h3 class="subt"><svg class="ic muted" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 등록된 지문</h3>
          <div id="list"></div>
          <h3 class="subt">지문별 난이도 (어려운 순)</h3>
          <div id="stats"></div>
        </section>

        <section class="view" data-view="homework">
          <h2 class="vtitle">숙제 내주기</h2>
          <div class="card">
            <div class="row">
              <div><label>학생</label><select id="hwStudent" style="width:100%;border:1px solid #e7e4dc;border-radius:11px;padding:12px;font-size:15px;font-family:inherit;background:#fff"></select></div>
              <div><label>차시 라벨 (선택)</label><input id="hwRound" placeholder="예: 7월 4주차"></div>
            </div>
            <label>지문</label>
            <select id="hwPassage" style="width:100%;border:1px solid #e7e4dc;border-radius:11px;padding:12px;font-size:15px;font-family:inherit;background:#fff"></select>
            <div class="row" style="margin-top:14px;align-items:end">
              <div>
                <label>시킬 것</label>
                <div style="display:flex;gap:16px;padding:10px 2px">
                  <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:#2b2a27;cursor:pointer"><input type="checkbox" id="hwOrder" checked style="width:auto"> 순서 맞추기</label>
                  <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:#2b2a27;cursor:pointer"><input type="checkbox" id="hwReading" checked style="width:auto"> 한줄 독해</label>
                </div>
              </div>
              <div><label>마감일 (선택)</label><input id="hwDue" type="date"></div>
            </div>
            <div id="hwMsg"></div>
            <button class="btn primary" style="margin-top:12px" onclick="saveAssignment()">숙제 내주기</button>
          </div>
          <h3 class="subt">내준 숙제</h3>
          <div id="hwList"></div>
        </section>

      </main>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
let editingId=null, allP=[];

function nat(a,b){return String(a||'').localeCompare(String(b||''),'ko',{numeric:true,sensitivity:'base'});}
const PATHS={
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
};
function ic(name,extra){return `<svg class="ic ${extra||''}" viewBox="0 0 24 24">${PATHS[name]||''}</svg>`;}
function showView(v){
  document.querySelectorAll('#admin .navbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.querySelectorAll('#admin .view').forEach(s=>s.classList.toggle('active',s.dataset.view===v));
  window.scrollTo({top:0});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jsStr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// ---------- 인증 ----------
async function init(){
  if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.includes('여기에')){
    document.body.innerHTML='<div style="text-align:center;padding:60px;color:#8a877f">config.js에 Supabase 키를 먼저 넣어주세요.</div>';return;
  }
  const { data:{ session } } = await db.auth.getSession();
  session ? showAdmin(session) : showLogin();
}
async function login(){
  const email=$('email').value.trim(), password=$('pw').value;
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if(error){ $('loginmsg').innerHTML=`<div class="msg err">${error.message}</div>`; return; }
  showAdmin(data.session);
}
async function logout(){ await db.auth.signOut(); showLogin(); }
function showLogin(){ $('login').style.display='block'; $('admin').style.display='none'; }
function showAdmin(session){
  window._session=session;
  $('login').style.display='none'; $('admin').style.display='block';
  $('who').textContent=session.user.email;
  loadAll();
}

// ---------- 문장 쪼개기 ----------
function splitText(){
  const raw=$('raw').value.trim(); if(!raw) return;
  const cleaned=raw.replace(/\s+/g,' ').trim();
  const parts=cleaned.match(/[^.!?]+[.!?]+["'”’)\]]*|\S.+$/g) || [cleaned];
  renderSentCards(parts.map(s=>s.trim()).filter(Boolean));
  $('splitwrap').style.display='block';
}
// ---------- 문장 카드 검수 ----------
const ABBR=/\b(?:Mr|Mrs|Ms|Dr|Prof|St|Jr|Sr|vs|etc|e\.g|i\.e|No|Fig|approx|Inc|Ltd)\.$|\b[A-Z]\.$|\d\.$/;
function renderSentCards(arr){
  const el=$('sentCards'); if(!el) return;
  el.innerHTML=arr.map((s,i)=>{
    const suspect=i>0&&ABBR.test(arr[i-1].trim());
    return `<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px">
      <span style="flex:0 0 24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        font-size:11px;font-weight:800;margin-top:8px;background:${suspect?'#c98a2b':'var(--accent-soft)'};color:${suspect?'#fff':'var(--accent)'}">${suspect?'!':i+1}</span>
      <div style="flex:1;min-width:0">
        <textarea class="scin" rows="2" style="margin:0;font-size:14px;line-height:1.6;padding:9px 11px${suspect?';border-color:#e8c58a;background:#fdf9f0':''}">${esc(s)}</textarea>
        ${suspect?`<div class="hint" style="color:#c98a2b;margin-top:2px">위 문장이 약어에서 끊긴 것 같아요. 합치기를 눌러 확인해보세요</div>`:''}
      </div>
      ${i>0?`<button class="btn ghost small" style="margin-top:5px;flex:0 0 auto${suspect?';border-color:#e8c58a;color:#c98a2b;font-weight:700':''}" onclick="mergeCard(${i})">합치기</button>`
        :'<span style="flex:0 0 62px"></span>'}
    </div>`;
  }).join('');
}
function readCards(){
  return [...document.querySelectorAll('#sentCards .scin')]
    .flatMap(t=>t.value.split('\n')).map(s=>s.trim()).filter(Boolean);
}
function mergeCard(i){
  const arr=[...document.querySelectorAll('#sentCards .scin')].map(t=>t.value.trim());
  if(i<1||i>=arr.length) return;
  arr[i-1]=(arr[i-1]+' '+arr[i]).replace(/\s+/g,' ');
  arr.splice(i,1);
  renderSentCards(arr.filter(Boolean));
}

let _pendingHwPid=null;
async function save(goHw){

  let res, newId=editingId;

    res=await db.from('passages').update({book,unit,title,sentences}).eq('id',editingId);

// ---------- 오늘: 처리 대기열 ----------
// 기준: ①안 열어본 새 제출 ②마감이 지났거나 오늘·내일인 미완료 숙제 ③3일 넘게 그대로인 다시 독해
let gFb=[], _tq=[];
function todayStrA(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function ddays(ds){ return Math.round((new Date(ds)-new Date(todayStrA()))/86400000); }
function dLabel(n){ return n===0?'D-DAY':n>0?`D-${n}`:`${-n}일 지남`; }
function getSeen(){ try{return JSON.parse(localStorage.getItem('oj_seen')||'[]');}catch(_){return [];} }
function markSeen(id){ const s=getSeen(); if(!s.includes(id)){ s.push(id); try{localStorage.setItem('oj_seen',JSON.stringify(s));}catch(_){} } }
function isDis(key){ try{return JSON.parse(localStorage.getItem('oj_dis')||'{}')[key]===todayStrA();}catch(_){return false;} }
function dismissToday(key){ try{const d=JSON.parse(localStorage.getItem('oj_dis')||'{}'); d[key]=todayStrA(); localStorage.setItem('oj_dis',JSON.stringify(d));}catch(_){} }
function stuNameOf(id){ const x=[...gStuReads,...gStuAtts].find(y=>y.user_id===id&&y.student_name); return x?x.student_name:'학생'; }
function pLabelOf(pid){ const p=allP.find(x=>x.id===pid); return esc(p?[p.book,p.unit,p.title].filter(Boolean).join(' · '):'(삭제된 지문)'); }
function tqGo(i){ const it=_tq[i]; if(!it) return; it.ok(); it.view(); renderToday(); }
function tqSkip(i){
  const it=_tq[i]; if(!it) return;
  it.ok();
  const row=document.getElementById('tq'+i);
  if(row){ row.classList.add('gone'); setTimeout(renderToday,320); } else renderToday();
}
function renderToday(){
  const el=$('todayView'); if(!el) return;
  const seen=getSeen();
  const items=[];
  for(const r of gStuReads){
    if(!r.id||seen.includes(r.id)) continue;
    const asg=gAsg.find(a=>a.student_id===r.user_id&&a.passage_id===r.passage_id);
    items.push({ stu:r.student_name||'학생', kind:'sub',
      ic:['제출','var(--accent-soft)','var(--accent)'],
      t:`${pLabelOf(r.passage_id)} ${r.is_retry?'다시 독해':'독해'}를 제출했어요`,
      s:`${fmt(r.created_at)}${asg&&asg.round_label?` · ${esc(asg.round_label)} 숙제`:''}`,
      view:()=>{ markSeen(r.id); openReading(rgOwner(r),r.passage_id,r.id); },
      ok:()=>markSeen(r.id) });
  }
  for(const a of gAsg){
    const st=hwStatus(a); if(st.done) continue;
    if(!a.due_date||ddays(a.due_date)>1) continue;
    const key='hw'+a.id; if(isDis(key)) continue;
    const remain=(a.steps||[]).filter(s2=>!st[s2]).map(s2=>s2==='order'?'순서 맞추기':'한줄 독해').join('와 ');
    items.push({ stu:stuNameOf(a.student_id), kind:'hw',
      ic:['숙제','#f8efdd','#c98a2b'],
      t:`${pLabelOf(a.passage_id)}의 ${remain}가 아직이에요`,
      s:`${a.round_label?esc(a.round_label)+' 숙제 · ':''}마감 <span class="dline" title="${dLabel(ddays(a.due_date))}">${esc(a.due_date.slice(5).replace('-','/'))}</span>`,
      view:()=>showView('homework'),
      ok:()=>dismissToday(key) });
  }
  const seenPair=new Set();
  for(const fb of gFb){
    const pairKey=fb.user_id+'|'+fb.passage_id;
    if(seenPair.has(pairKey)) continue; seenPair.add(pairKey);
    if(!(fb.flagged||[]).length) continue;
    const cleared=gStuReads.some(r=>r.user_id===fb.user_id&&r.passage_id===fb.passage_id
      &&new Date(r.created_at)>new Date(fb.created_at));
    if(cleared) continue;
    const age=-ddays(fb.created_at.slice(0,10));
    if(age<3) continue;
    const key='fb'+fb.id; if(isDis(key)) continue;
    items.push({ stu:stuNameOf(fb.user_id), kind:'flag',
      ic:['재독','#f7e6e3','#c0584b'],
      t:`${pLabelOf(fb.passage_id)} 다시 독해가 ${age}일째 그대로예요`,
      s:`표시된 문장 ${(fb.flagged||[]).length}개`,
      view:()=>{ showView('student'); showSub('sfb'); },
      ok:()=>dismissToday(key) });
  }
  _tq=items;
  const cnt=k=>items.filter(x=>x.kind===k).length;
  let html=`<div class="kpis">
    <div class="kpi"><b style="color:var(--accent)">${cnt('sub')}</b><span>새 제출</span></div>
    <div class="kpi"><b style="color:#c98a2b">${cnt('hw')}</b><span>챙길 숙제</span></div>
    <div class="kpi"><b style="color:#c0584b">${cnt('flag')}</b><span>재독해 방치</span></div>
  </div>`;
  if(!items.length){
    html+=`<div class="alldone">오늘 확인할 것을 다 비웠어요</div>`;
  }else{
    const byStu=new Map();
    items.forEach((it,i)=>{ if(!byStu.has(it.stu)) byStu.set(it.stu,[]); byStu.get(it.stu).push(i); });
    for(const [stu,idxs] of byStu){
      html+=`<h3 class="subt">${ic('user','muted')} ${esc(stu)}</h3>`;
      for(const i of idxs){
        const it=items[i];
        html+=`<div class="tq" id="tq${i}">
          <div class="tic" style="background:${it.ic[1]};color:${it.ic[2]}">${it.ic[0]}</div>
          <div class="tg"><div class="tt">${it.t}</div><div class="ts">${it.s}</div></div>
          <button class="btn primary small" onclick="tqGo(${i})">확인하기</button>
          <a style="font-size:12px;color:var(--sub);cursor:pointer;flex:0 0 auto" onclick="tqSkip(${i})">넘기기</a>
        </div>`;
      }
    }
  }
  el.innerHTML=html;
}

        <div class="kpi"><b>${goodPct===null?'·':goodPct+'%'}</b><span>독해 good 비율</span></div>
        <div class="kpi"><b>${doneCnt}/${myAsg2.length}</b><span>완료 숙제</span></div>
      </div>
      ${top.length?`<div style="font-weight:700;font-size:13px;margin-bottom:8px">취약 태그, 다음 수업에서 다룰 것</div>`+
        top.map(([tag,c])=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px">
          <span style="flex:0 0 90px;font-weight:600">${esc(tag)}</span>
          <span style="flex:1;height:8px;background:var(--bg);border-radius:999px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(c/maxT*100)}%;background:#c98a2b;border-radius:999px"></span></span>
          <span style="flex:0 0 34px;text-align:right;color:var(--sub);font-weight:700">${c}회</span>
        </div>`).join(''):''}
    </div>`;
  }
  el.innerHTML=html;
}

// ---------- AI 인사이트 (주간 요약·태그 증감·다음 숙제 추천, 전부 데이터 기반) ----------
function renderInsight(){
  const el=$('insightView'); if(!el) return;
  const uidMe=window._session?window._session.user.id:null;
  const stus=new Map();
  for(const x of [...gStuReads,...gStuAtts]) if(x.user_id&&x.student_name&&x.user_id!==uidMe) stus.set(x.user_id,x.student_name);
  if(!stus.size){ el.innerHTML='<p class="sub">학생 기록이 쌓이면 인사이트가 여기 떠요.</p>'; return; }
  const now=Date.now(), WK=7*86400000;
  let html='';
  for(const [uid,name] of stus){
    const fbs=gFb.filter(f=>f.user_id===uid);
    const cur=fbs.filter(f=>now-new Date(f.created_at)<WK);
    const prev=fbs.filter(f=>{const d=now-new Date(f.created_at);return d>=WK&&d<2*WK;});
    const notesOf=a=>a.flatMap(f=>f.sentence_notes||[]);
    const gp=a=>{const n=notesOf(a);return n.length?Math.round(n.filter(x=>x.verdict==='good').length/n.length*100):null;};
    const curPct=gp(cur), prevPct=gp(prev);
    const tagCnt=a=>{const t={};for(const n of notesOf(a)) if(n.verdict!=='good'&&n.skill_tag) t[n.skill_tag]=(t[n.skill_tag]||0)+1;return t;};
    const ct=tagCnt(cur), pt=tagCnt(prev);
    const tags=Object.entries(ct).sort((a,b)=>b[1]-a[1]);
    let sum='';
    if(!cur.length){ sum=`최근 7일 동안 새 진단이 없어요.${fbs.length?' 지난 기록은 AI 진단 탭에 있어요.':''}`; }
    else{
      sum=`최근 7일 동안 진단 ${cur.length}건을 받았어요. `;
      if(curPct!==null){
        sum+=`잘 읽은 문장 비율은 ${curPct}%`;
        if(prevPct!==null){ const d=curPct-prevPct;
          sum+= d>0?`로, 지난주보다 ${d}%p 올랐어요. `: d<0?`로, 지난주보다 ${-d}%p 내렸어요. `:`로 지난주와 같아요. `;
        } else sum+='예요. ';
      }
      sum+= tags.length?`이번 주 가장 자주 걸린 유형은 ${tags[0][0]}(${tags[0][1]}회)예요.`:'걸린 문장이 없었어요. 아주 잘하고 있어요.';
    }
    const tagRows=tags.slice(0,4).map(([tag,c])=>{
      const p2=pt[tag]||0;
      const arrow=c>p2?`<span style="color:var(--no);font-weight:700">▲${c-p2}</span>`
        :c<p2?`<span style="color:var(--accent);font-weight:700">▼${p2-c}</span>`
        :'<span style="color:var(--sub)">그대로</span>';
      const maxC=tags[0][1]||1;
      return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px">
        <span style="flex:0 0 90px;font-weight:600">${esc(tag)}</span>
        <span style="flex:1;height:8px;background:var(--bg);border-radius:999px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(c/maxC*100)}%;background:#c98a2b;border-radius:999px"></span></span>
        <span style="flex:0 0 30px;text-align:right;color:var(--sub);font-weight:700">${c}회</span>
        <span style="flex:0 0 52px;text-align:right;font-size:11px">${arrow}</span>
      </div>`;
    }).join('');
    // 다음 숙제 추천: 안 읽었고 숙제로 안 낸 지문 중, 최다 취약 유형에 맞는 것
    const readPids=new Set(gStuReads.filter(r=>r.user_id===uid).map(r=>r.passage_id));
    const asgPids=new Set(gAsg.filter(a=>a.student_id===uid).map(a=>a.passage_id));
    const candidates=allP.filter(p=>!readPids.has(p.id)&&!asgPids.has(p.id));
    let recHtml='';
    if(tags.length&&candidates.length){
      const top=tags[0][0];
      const score=p=>{
        const text=(p.sentences||[]).join(' ');
        if(top==='지칭') return (text.match(/\b(it|they|this|that|these|those|them|its|their|such)\b/gi)||[]).length;
        if(top==='어휘') return (text.match(/\b[a-z]{9,}\b/gi)||[]).length;
        if(top==='연결어'||top==='흐름') return (text.match(/\b(however|although|therefore|thus|moreover|nevertheless|whereas|while|consequently|instead)\b/gi)||[]).length;
        return (p.sentences||[]).reduce((m,s)=>Math.max(m,String(s).split(' ').length),0);
      };
      const rec=candidates.slice().sort((a,b)=>score(b)-score(a))[0];
      const why={'지칭':'대명사가 많이 나와 지칭 추론 연습에 좋아요','어휘':'긴 어휘가 많아 어휘 추론 연습에 좋아요',
        '연결어':'연결어가 자주 나와 흐름 잡기 연습에 좋아요','흐름':'연결어가 자주 나와 흐름 잡기 연습에 좋아요'};
      recHtml=`<div style="display:flex;align-items:center;gap:10px;border-top:1px solid #eee9df;margin-top:12px;padding-top:12px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px;color:var(--accent)">다음 숙제 추천</div>
          <div style="font-size:12.5px;margin-top:2px">${pLabelOf(rec.id)}</div>
          <div style="font-size:11.5px;color:var(--sub)">${why[top]||'긴 문장이 있어 구조 연습에 좋아요'}</div>
        </div>
        <button class="btn primary small" onclick="recAssign('${rec.id}','${uid}')">이 지문으로 숙제 내기</button>
      </div>`;
    }
    html+=`<div class="card" style="margin-bottom:14px">
      <div style="font-weight:700;font-size:15px;margin-bottom:8px">${esc(name)}, 이번 주</div>
      <div style="font-size:13.5px;line-height:1.7;margin-bottom:${tags.length?'12px':'0'}">${sum}</div>
      ${tagRows?`<div style="font-weight:700;font-size:13px;margin-bottom:8px">취약 유형, 지난주와 비교</div>${tagRows}`:''}
      ${recHtml}
    </div>`;
  }
  el.innerHTML=html;
}

  showView('homework');

  if($('hwStudent')) $('hwStudent').value=uid;

async function loadHomework(){

    if($('hwPassage')) $('hwPassage').value=_pendingHwPid;
    _pendingHwPid=null;

  }
}
function hwStatus(a){
  const after=t=>t&&new Date(t)>=new Date(a.created_at);
  const st={}; const steps=a.steps||[];
  if(steps.includes('order'))
    st.order=gStuAtts.some(x=>x.user_id===a.student_id&&x.passage_id===a.passage_id&&x.is_correct&&after(x.created_at));
  if(steps.includes('reading'))
    st.reading=gStuReads.some(r=>r.user_id===a.student_id&&r.passage_id===a.passage_id&&!r.is_retry&&after(r.created_at));
  st.done=steps.length>0&&steps.every(s=>st[s]);
  return st;
}
function renderHwList(){
  if(!gAsg.length){ $('hwList').innerHTML='<p class="sub">아직 내준 숙제가 없어요.</p>'; return; }
  // 차시(round_label)별로 묶기, 최신 차시 먼저
  const groups=new Map();
  for(const a of gAsg){
    const k=a.round_label||'차시 미지정';
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(a);
  }
  let html='';
  for(const [round,list] of groups){
    const doneN=list.filter(a=>hwStatus(a).done).length;
    const pct=Math.round(doneN/list.length*100);
    const rows=list.map(a=>{
      const st=hwStatus(a);
      const stepNm=(a.steps||[]).map(s=>s==='order'?'순서':'독해').join('+');
      const due=a.due_date
        ? `<span class="dline" title="${dLabel(ddays(a.due_date))}">${esc(a.due_date.slice(5).replace('-','/'))}</span>`
        : '<span style="color:var(--sub)">없음</span>';
      return `<div style="display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #eee9df;font-size:13px">
        <span class="badge ${st.done?'ok':''}" style="font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:${st.done?'var(--accent)':'var(--no)'}">${st.done?'완료':'미완료'}</span>
        <b style="flex:0 0 auto">${esc(stuNameOf(a.student_id))}</b>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${pLabelOf(a.passage_id)}</span>
        <span style="flex:0 0 auto;color:var(--sub);font-size:12px">${stepNm}</span>
        <span style="flex:0 0 auto;font-size:12px">마감 ${due}</span>
        <a style="flex:0 0 auto;color:#c0584b;cursor:pointer;font-size:12px" onclick="delAssignment('${a.id}')">삭제</a>
      </div>`;
    }).join('');
    html+=`<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <b style="font-size:14px">${esc(round)}</b>
        <span style="flex:1;height:7px;background:var(--bg);border-radius:999px;overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:var(--accent);border-radius:999px"></span></span>
        <span style="font-size:12px;color:var(--sub);font-weight:700">${doneN}/${list.length} 완료</span>
        <button class="btn ghost small" onclick="reuseRound('${jsStr(round)}')">이 차시 재사용</button>
      </div>
      ${rows}
    </div>`;
  }
  $('hwList').innerHTML=html;
}
async function reuseRound(round){
  const list=gAsg.filter(a=>(a.round_label||'차시 미지정')===round);
  if(!list.length) return;
  const label=prompt('새 차시 라벨을 입력하세요 (예: 8월 1주차)','');
  if(label===null) return;
  const due=prompt('마감일을 입력하세요 (YYYY-MM-DD, 비우면 마감 없음)','');
  if(due===null) return;
  const rows=list.map(a=>({ student_id:a.student_id, passage_id:a.passage_id, steps:a.steps,
    round_label:label.trim()||null, due_date:(due||'').trim()||null }));
  const { error } = await db.from('assignments').insert(rows);
  if(error){ msg('hwMsg','재사용 실패: '+error.message,'err'); return; }
  msg('hwMsg',`${esc(round)}의 숙제 ${rows.length}개를 새 차시로 복사했어요`,'ok');
  loadHomework();
}
async function saveAssignment(){
  const student_id=$('hwStudent').value, passage_id=$('hwPassage').value;
  const steps=[]; if($('hwOrder').checked) steps.push('order'); if($('hwReading').checked) steps.push('reading');
  if(!student_id){ msg('hwMsg','학생 기록이 아직 없어요. 학생이 한 번 로그인해 활동하면 목록에 떠요','err'); return; }
  if(!passage_id){ msg('hwMsg','지문을 선택하세요','err'); return; }
  if(!steps.length){ msg('hwMsg','순서/독해 중 최소 하나는 체크해야 해요','err'); return; }
  const row={ student_id, passage_id, steps,
    round_label:$('hwRound').value.trim()||null, due_date:$('hwDue').value||null };
  const { error } = await db.from('assignments').insert(row);
  if(error){ msg('hwMsg','저장 실패: '+error.message,'err'); return; }
  msg('hwMsg','숙제를 내줬어요 ✓ 학생 홈에 바로 떠요','ok');
  loadHomework();
}
async function delAssignment(id){
  if(!confirm('이 숙제를 삭제할까요?')) return;
  const { error } = await db.from('assignments').delete().eq('id',id);
  if(!error) loadHomework();
}

async function loadStats(){
  const { data:atts, error } = await db.from('attempts').select('passage_id,score,total,is_correct,user_id');
  if(error){ $('stats').innerHTML=`<div class="msg err">통계를 불러오지 못했어요.<br>${error.message}</div>`; return; }
  if(!atts || !atts.length){ $('stats').innerHTML='<p class="sub">아직 풀이 데이터가 없어요.</p>'; return; }
  const byP={};
  for(const a of atts){
    const s=byP[a.passage_id]=byP[a.passage_id]||{att:0,ratio:0,students:new Set(),solved:new Set()};
    s.att++; s.ratio += a.total ? a.score/a.total : 0; s.students.add(a.user_id);
    if(a.is_correct) s.solved.add(a.user_id);
  }
  const rows=Object.keys(byP).map(pid=>{
    const p=allP.find(x=>x.id===pid); if(!p) return null;
    const s=byP[pid];
    return {p, avg:Math.round(s.ratio/s.att*100), att:s.att, students:s.students.size, solved:s.solved.size};
  }).filter(Boolean).sort((a,b)=>a.avg-b.avg); // 어려운(낮은) 순

  let html='';
  for(const r of rows){
    const label=[r.p.book,r.p.unit,r.p.title].filter(Boolean).join(' · ');
    const color=r.avg<50?'var(--no)':r.avg<80?'#c98a2b':'var(--accent)';
    html+=`<div class="statrow">
      <div class="top"><b>${esc(label)}</b><span class="pct" style="color:${color}">${r.avg}%</span></div>
      <div class="sbarbg"><div class="sbar" style="width:${r.avg}%;background:${color}"></div></div>
      <div class="c">평균 정답률 · 시도 ${r.att}회 · 학생 ${r.students}명 · 해결 ${r.solved}명</div>
    </div>`;
  }
  $('stats').innerHTML=html;
}

      <span class="chev">›</span> ${ic('book','muted')} ${esc(book)} <span class="cnt">${total}개</span></button><div class="bookbody">`;

      for(const p of units[unit]){
        html+=`<div class="pi"><span class="t">${esc(p.title)}</span><span class="c">문장 ${p.sentences.length}</span>
          <button class="btn ghost small" onclick='edit("${p.id}")'>수정</button>
          <button class="btn danger small" onclick='del("${p.id}")'>삭제</button></div>`;
      }
    }
    html+='</div></div>';
  }
  $('list').innerHTML=html;
}
function buildGroups(list){
  const sorted=[...list].sort((a,b)=> nat(a.book,b.book)||nat(a.unit,b.unit)||nat(a.title,b.title));
  const map=new Map();
  for(const p of sorted){
    const b=p.book||'미분류', u=p.unit||'';
    if(!map.has(b)) map.set(b,{});
    const units=map.get(b); (units[u]=units[u]||[]).push(p);
  }
  return map;
}

function orderLines(p,a){
  return (a.submitted||[]).map((origIdx,pos)=>{
    const ok=origIdx===pos;
    return `<div class="ord ${ok?'good':''}">
      <span class="p">${pos+1}</span>
      <span class="s">${esc(p.sentences[origIdx]||'')}</span>
      ${ok?'<span class="fix" style="color:var(--accent)">✓</span>':`<span class="fix">→ 원래 ${origIdx+1}번</span>`}</div>`;
  }).join('');
}
async function loadRecords(){
  const { data:atts, error } = await db.from('attempts').select('*').order('created_at',{ascending:true});
  if(error){ $('records').innerHTML=`<div class="msg err">기록 표(attempts)가 아직 없어요. SQL을 실행했는지 확인하세요.<br>${error.message}</div>`; return; }
  if(!atts || !atts.length){ $('records').innerHTML='<p class="sub">아직 학생이 푼 기록이 없어요.</p>'; return; }

  // 계정ID 기준으로 학생 구분(동명이인 안 섞이게), 이름은 표시용
  const tree={}, nameOf={};
  for(const a of atts){
    const uid=a.user_id||a.student_email||'unknown';
    nameOf[uid]=a.student_name||a.student_email||'학생'; // 시간 오름차순이라 마지막=최신 이름
    (tree[uid]=tree[uid]||{});
    (tree[uid][a.passage_id]=tree[uid][a.passage_id]||[]).push(a);
  }

  let html='';
  const uids=Object.keys(tree).sort((x,y)=>nat(nameOf[x],nameOf[y]));
  for(const uid of uids){
    const who=nameOf[uid];
    const byP=tree[uid];
    const entries=Object.keys(byP).map(pid=>{
      const list=byP[pid]; const p=allP.find(x=>x.id===pid);
      return {p,list,latest:list[list.length-1]};
    }).filter(e=>e.p);
    entries.sort((x,y)=>nat(x.p.book,y.p.book)||nat(x.p.unit,y.p.unit)||nat(x.p.title,y.p.title));
    const solvedCnt=entries.filter(e=>e.latest.is_correct).length;
    const wrongCnt=entries.length-solvedCnt;
    html+=`<div style="font-weight:700;font-size:14px;margin:16px 2px 8px">${ic('user','muted')} ${esc(who)}
      <span style="color:var(--sub);font-weight:500;font-size:12px">· 오답 ${wrongCnt} · 해결 ${solvedCnt}</span></div>`;

    for(const {p,list,latest} of entries){
      const label=[p.book,p.unit,p.title].filter(Boolean).join(' · ');
      const solved=latest.is_correct;
      const wrongTries=list.filter(a=>!a.is_correct).length;
      const tries=list.map((a,n)=>`
        <div style="margin-top:10px">
          <div style="font-size:12px;color:var(--sub);font-weight:600">${n+1}차 · ${fmt(a.created_at)} · ${a.score}/${a.total} <span style="color:${a.is_correct?'var(--accent)':'var(--no)'}">${a.is_correct?'✓ 정답':'✗ 오답'}</span></div>
          ${orderLines(p,a)}
        </div>`).join('');
      html+=`<div class="rec${solved?' solved':''}">
        <div class="rh"><span class="badge">${solved?'해결':'오답'} ${latest.score}/${latest.total}</span> ${esc(label)}
          <span class="when">시도 ${list.length}회 · 오답 ${wrongTries}회</span></div>
        <span class="toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'">시도별 풀이 모두 보기 ▾</span>
        <div style="display:none">${tries}</div>
      </div>`;
    }
  }
  $('records').innerHTML=html;
}

      </span></div>`;
  }).join('');
  const allWords=[...new Set((r.interpretations||[]).flatMap(it=>it.unknown_words||[]))];
  const kind=r.is_retry
    ? `<span style="color:#c98a2b">다시 독해</span>`
    : `<span style="color:var(--accent)">${n===0?'1차 독해':`${n+1}차 독해`}</span>`;
  return `<div id="rr_${r.id}" style="margin-top:12px;border-top:1px dashed #e3ddd1;padding-top:10px">
    <div style="font-size:12.5px;font-weight:700">${kind} <span style="font-weight:500;color:var(--sub)">· ${fmt(r.created_at)}${r.is_retry?` · ${(r.interpretations||[]).length}문장만`:''}</span></div>
    ${r.topic?`<div style="margin-top:6px;font-size:13px;background:#fff;border-radius:8px;padding:8px 10px"><b>주제:</b> ${esc(r.topic)}</div>`:''}
    <div style="margin-top:6px">${lines}</div>
    ${allWords.length?`<div style="margin-top:8px;font-size:12px;color:var(--sub)">📒 표시한 단어 ${allWords.length}개: ${allWords.map(esc).join(', ')}</div>`:''}
  </div>`;
}
function toggleRG(gid){
  const el=document.getElementById(gid); if(!el) return;
  const b=el.querySelector('.rgbody'); if(!b) return;
  const open=b.style.display!=='none';
  b.style.display=open?'none':'block';
  const ch=el.querySelector('.chev2'); if(ch) ch.style.transform=open?'':'rotate(180deg)';
}
async function loadReadings(){
  const { data:rs, error } = await db.from('readings').select('*').order('created_at',{ascending:false});
  if(error){ $('readings').innerHTML=`<div class="msg err">독해 표(readings)가 아직 없어요. SQL을 실행했는지 확인하세요.<br>${error.message}</div>`; return; }
  if(!rs || !rs.length){ $('readings').innerHTML='<p class="sub">아직 학생이 독해한 기록이 없어요.</p>'; return; }
  const groups=new Map();               // rs가 최신순이라 그룹 순서도 최근 제출 순
  for(const r of rs){
    const k=rgOwner(r)+'|'+r.passage_id;
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(r);
  }
  let html='';
  for(const list of groups.values()){
    const latest=list[0], asc=list.slice().reverse();
    const p=allP.find(x=>x.id===latest.passage_id);
    const label=p?[p.book,p.unit,p.title].filter(Boolean).join(' · '):'(삭제된 지문)';
    const who=latest.student_name||latest.student_email||'학생';
    const gid=rgId(rgOwner(latest),latest.passage_id);
    const retryN=list.filter(r=>r.is_retry).length;
    let n=0;
    const subs=asc.map(r=>readingBlockHTML(r,r.is_retry?-1:n++)).join('');
    html+=`<div class="rec solved" id="${gid}">
      <div class="rh" style="cursor:pointer" onclick="toggleRG('${gid}')">
        <span class="badge">독해</span> ${esc(who)} · ${esc(label)}
        ${retryN?`<span style="font-size:11px;font-weight:700;color:#c98a2b;background:#f8efdd;border-radius:999px;padding:1px 8px;flex:0 0 auto">다시 독해 ${retryN}회</span>`:''}
        <span class="when">제출 ${list.length}회 · 최근 ${fmt(latest.created_at)} <span class="chev2" style="display:inline-block;transition:transform .2s">▾</span></span>
      </div>
      <div class="rgbody" style="display:none">${subs}</div>
    </div>`;
  }
  $('readings').innerHTML=html;
}
// 오늘 대기열 "확인하기" → 독해 탭으로 가서 해당 그룹을 펼치고 그 제출 위치로 스크롤
function openReading(owner,pid,rid){
  showView('student'); showSub('sread');
  const gid=rgId(owner||'unknown',pid);
  const el=document.getElementById(gid); if(!el) return;
  const b=el.querySelector('.rgbody');
  if(b&&b.style.display==='none') toggleRG(gid);
  const target=rid?document.getElementById('rr_'+rid):null;
  setTimeout(()=>{
    (target||el).scrollIntoView({behavior:'smooth',block:'start'});
    el.style.transition='box-shadow .35s';
    el.style.boxShadow='0 0 0 3px var(--accent)';
    setTimeout(()=>{ el.style.boxShadow=''; },1800);
  },80);
}

// ---------- 수정 / 삭제 ----------
function edit(id){
  const p=allP.find(x=>x.id===id); if(!p) return;
  editingId=p.id;
  $('book').value=p.book||''; $('unit').value=p.unit||''; $('title').value=p.title||'';
  $('raw').value=''; renderSentCards(p.sentences||[]);
  $('splitwrap').style.display='block'; renderUnitChips();
  showView('passages');
  window.scrollTo({top:0,behavior:'smooth'});
}
async function del(id){
  const p=allP.find(x=>x.id===id); if(!p) return;
  if(!confirm(`"${p.title}" 지문을 삭제할까요?`)) return;
  const { error } = await db.from('passages').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  loadAll();
}

function msg(el,text,kind){ $(el).innerHTML=`<div class="msg ${kind}">${text}</div>`; }

init();
</script>
